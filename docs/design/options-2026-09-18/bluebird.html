6 6m0-6-6 6"/>',send:'<path d="m21 3-7 18-4-7-7-4Z"/><path d="m10 14 11-11"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 5"/>',trend:'<path d="m3 17 6-6 4 4 8-11m-6 0h6v6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',book:'<path d="M12 5C7 2 3 3 3 3v16s4-1 9 2c5-3 9-2 9-2V3s-4-1-9 2Zm0 0v16"/>',refresh:'<path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/>'};
const I=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.spark}</svg>`;
const bird=()=>'<svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M7 22C7 12 12 6 20 6c5 0 8 4 8 8l5 3-5 3c-1 7-6 11-14 10l-7 2 3-6" fill="currentColor" opacity=".22"/><path d="M7 22C7 12 12 6 20 6c5 0 8 4 8 8l5 3-5 3c-1 7-6 11-14 10l-7 2 3-6M9 21c7 1 11-3 12-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="13" r="1.4" fill="currentColor"/></svg>';
const E=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'), modalRoot=document.getElementById('modal-root');
let state={workspaceName:'Personal workspace',language:'English',feedback:[],reviewText:{},view:'workspace',tab:'sources',search:'',layout:'grid',selected:0,topic:0,paused:false,messages:[],approvals:[true,true,false,true,false,false],period:'week',built:false,sources:[{name:'Nexon product brochure.pdf',meta:'Product document · sample source',kind:'file',badge:'Reviewed'},{name:'Official product page',meta:'Manufacturer website · sample source',kind:'link',badge:'Reviewed'},{name:'Product image collection',meta:'8 photos · exterior and interior',kind:'image',badge:'Ready'},{name:'Competition reference pages',meta:'Brezza & Venue · sample references',kind:'link',badge:'Reviewed'}]};
let demos=[{name:'Tata Nexon',type:'Passenger vehicles',image:'nexon.avif',class:'nexon',status:'Ready',time:'3 min',sessions:'248'},{name:'TVS iQube',type:'Electric mobility',image:'iqube.jpg',class:'iqube',status:'In review',time:'4 min',sessions:'126'},{name:'Audi Q5',type:'Premium automotive',image:'audi.jpg',class:'audi',status:'Draft',time:'5 min',sessions:'—'}];
const topics=[{name:'Overview',headline:'Meet your next\neveryday adventure.',intro:'A closer look at the details that matter to you.',image:'nexon.avif',class:'overview',caption:'Welcome. We can explore the design, take a look inside, or focus on the things that matter to your everyday drive.'},{name:'Design',headline:'A presence\nof its own.',intro:'Explore the shape, stance and exterior details.',image:'side.avif',class:'design',caption:'Let’s take a look around. You can pause on any detail or ask a question before we move on.'},{name:'Cabin',headline:'Make yourself\nat home.',intro:'See the space from a different perspective.',image:'cabin.avif',class:'cabin',caption:'Here’s the view from the driver’s seat. What would you like to look at more closely: the seating, the controls, or everyday comfort?'},{name:'Practicality',headline:'Room for\nyour routine.',intro:'Look beyond the specification sheet.',image:'boot.avif',class:'practicality',caption:'Think about what you carry on a normal week. This is a visual preview; a real demo would use reviewed evidence to answer specific capacity questions.'}];
const approvalDefs=[['shield','Product facts','Review the product claims and their supporting sources.','21 source references'],['message','Conversation','Check the opening, the story and each customer check-in.','38 narration lines'],['image','Visual story','Review the slide order, photography and evidence callouts.','12 slides'],['users','Guide & voice','Choose the guide’s identity, language and delivery.','English · Priya'],['arrow','Next steps','Keep follow-up choices clear, optional and relevant.','2 customer choices'],['book','Questions & answers','Review the answers and where the guide should decline.','18 sample questions']];
function nav(view){state.view=view;state.messages=[];render();window.scrollTo({top:0,behavior:'auto'});}
function openStudio(i=0){state.selected=i;state.tab='sources';nav('studio');}
function openDemo(i=state.selected){state.selected=i;state.topic=0;state.paused=false;nav('demo');}
function toast(t){document.getElementById('toast-root').innerHTML=`<div class="toast">${I('checkcircle')}${E(t)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3300);}
function navButtons(mobile=false){return [['workspace','home','Workspace'],['studio','layers','Studio'],['demo','play','Showroom'],['insights','chart','Insights']].map(([v,i,n])=>`<button class="${state.view===v?'active':''}" onclick="nav('${v}')" title="${n}" aria-label="${n}">${I(i)}${mobile?n:''}</button>`).join('');}
function chrome(content){return `<div class="shell"><div class="main"><header class="header"><div class="header-left"><div class="mobile-brand">${bird()}</div><button class="wordmark" onclick="nav('workspace')">Demo<span>Studio</span></button></div><nav class="desktop-nav" aria-label="Main navigation">${navButtons(true)}</nav><div class="header-right"><button class="small-link" onclick="help()">${I('book')} Quick guide</button><span class="divider"></span><button class="icon-button" aria-label="Notifications" onclick="toast('You’re all caught up. This is a local design preview.')">${I('bell')}</button><button class="avatar" aria-label="Workspace settings" onclick="settings()">AP</button></div></header><nav class="mobile-nav" aria-label="Main navigation">${navButtons(true)}</nav>${content}</div></div>`;}

function render(){app.innerHTML=chrome(({workspace:workspace,studio:studio,demo:customer,insights:insights})[state.view]());}
function gallery(){const filtered=demos.map((d,i)=>({d,i})).filter(({d})=>d.name.toLowerCase().includes(state.search.toLowerCase()));return filtered.length?filtered.map(({d,i})=>`<article class="demo-card"><div class="card-picture ${d.class}"><span class="badge ${d.status==='Ready'?'ready':'draft'}"><i class="dot"></i>${E(d.status)}</span><button class="icon-button card-menu" aria-label="Options for ${E(d.name)}" onclick="demoOptions(${i})">${I('more')}</button><img src="./assets/${d.image}" alt="${E(d.name)} product photograph"></div><div class="card-main"><div class="card-category">${E(d.type)}</div><h3>${E(d.name)}</h3><div class="card-meta"><span>${I('clock')} ${d.time}</span><span>${I('users')} ${d.sessions} sample sessions</span></div><div class="card-actions"><button class="btn small ${d.status==='Ready'?'primary':''}" onclick="openDemo(${i})">${I('play')} Preview demo</button><button class="text-link" onclick="openStudio(${i})">Open studio ${I('arrow')}</button></div></div></article>`).join(''):`<div class="empty">No demos match “${E(state.search)}”.<br><button class="btn small" style="margin-top:16px" onclick="state.search='';render()">Clear search</button></div>`;}
function workspace(){return `<div class="content"><div class="page-heading"><div><div class="overline"><span class="dot"></span> ${E(state.workspaceName).toUpperCase()}</div><h1>A great demo changes everything.</h1><p>Bring your products to life, one conversation at a time.</p></div><button class="btn primary" onclick="createDemo()">${I('plus')} Create a demo</button></div><div class="workspace-grid"><section class="hero"><div class="hero-copy"><div class="overline">THE NEXT CONVERSATION STARTS HERE</div><h2>Less explaining.<br>More exploring.</h2><p>Your product. A thoughtful guide. An experience built around your customer.</p><button class="btn white" onclick="openDemo(0)">Enter the Nexon showroom ${I('arrow')}</button></div><div class="hero-caption">${I('shield')} Reviewed content. Human approved.</div><img class="hero-picture" src="./assets/nexon.avif" alt="Tata Nexon showroom spotlight"><span class="hero-note">FEATURED EXPERIENCE / TATA NEXON</span></section><aside class="pulse-card"><div class="pulse-title">Workspace pulse ${I('chart')}</div><p class="pulse-period">Illustrative · last 7 days</p><strong class="pulse-number">374</strong><p class="pulse-desc">customer conversations started</p><div class="trend">${I('trend')} 18% more than the previous week</div><div class="spark">${[32,41,29,52,43,61,49,72,65,86,80,100].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div class="pulse-foot"><span>12 SEP</span><span>18 SEP</span></div></aside></div><section><div class="section-heading"><div><h2>Your demo collection</h2><p>Crafted experiences, ready for a closer look.</p></div><div class="toolbar"><label class="search">${I('search')}<input aria-label="Search demo collection" placeholder="Find a demo…" value="${E(state.search)}" oninput="state.search=this.value;document.getElementById('gallery').innerHTML=gallery()"><span class="keyboard-hint">⌕</span></label><div class="segmented"><button class="${state.layout==='grid'?'active':''}" aria-label="Grid view" onclick="state.layout='grid';render()">${I('grid')}</button><button class="${state.layout==='list'?'active':''}" aria-label="List view" onclick="state.layout='list';render()">${I('list')}</button></div></div></div><div id="gallery" class="gallery ${state.layout==='list'?'list':''}">${gallery()}</div></section><div class="workspace-bottom"><article class="tip-card"><div class="tip-icon">${bird()}</div><div><h3>Your guide, with your point of view.</h3><p>Give every conversation a consistent identity, while keeping the human approval in your hands.</p><button class="text-link" onclick="state.tab='align';nav('studio')">Meet your guide ${I('arrow')}</button></div></article><article class="tip-card"><div class="tip-icon">${I('chart')}</div><div><h3>Find out what customers care about.</h3><p>Explore the questions, moments and next steps behind your demos.</p><button class="text-link" onclick="nav('insights')">Explore sample insights ${I('arrow')}</button></div></article></div><footer class="footer"><span>Designed for thoughtful conversations.</span><span>All metrics and content are illustrative. No live connections.</span></footer></div>`;}
function stepper(){return `<nav class="stepper" aria-label="Studio workflow">${[['sources','Sources','Add your product knowledge'],['align','Align','Review and approve the story'],['rehearse','Rehearse','Experience it as a customer']].map(([v,n,d],i)=>`${i?`<span class="step-arrow">${I('chevron')}</span>`:''}<button class="step ${state.tab===v?'active':''} ${state.tab!=='sources'&&i===0?'done':''}" onclick="state.tab='${v}';render()"><span class="step-number">${state.tab!=='sources'&&i===0?I('check'):i+1}</span><span><strong>${n}</strong><small>${d}</small></span></button>`).join('')}</nav>`;}
function studio(){const d=demos[state.selected]||demos[0];return `<div class="content"><div class="studio-head"><div class="product-identity"><div class="product-thumb"><img src="./assets/${d.image}" alt="${E(d.name)}"></div><div><div class="overline">EXPERIENCE STUDIO</div><h1>${E(d.name)}</h1><p class="sample-label">In-memory design preview · changes stay in this tab</p></div></div><div class="studio-actions"><button class="btn" onclick="toast('Your preview changes are already kept in memory for this tab.')">${I('checkcircle')} Saved locally</button><button class="btn primary" onclick="openDemo()">${I('play')} Preview</button></div></div>${stepper()}${state.tab==='sources'?sources():state.tab==='align'?align():rehearse()}</div>`;}
function sources(){return `<div class="studio-layout"><section class="panel"><div class="panel-title"><div><h2>Start with what you know.</h2><p>Give your guide the material it needs to tell the right story.</p></div><span class="badge">${state.sources.length} sources</span></div><div class="dropzone"><div class="drop-icon">${I('upload')}</div><h3>Every great demo starts with good material.</h3><p>Documents, product photos and official website references.</p><button class="btn" onclick="addSource()">${I('plus')} Add sample material</button></div><div class="source-list">${state.sources.map((s,i)=>`<div class="source-row"><div class="file-icon">${I(s.kind)}</div><div><strong>${E(s.name)}</strong><small>${E(s.meta)}</small></div><span class="badge ${s.badge==='Reviewed'?'ready':''}">${E(s.badge)}</span><button class="icon-button" aria-label="Review ${E(s.name)}" onclick="sourceDetail(${i})">${I('chevron')}</button></div>`).join('')}</div><div class="panel-foot"><p>Nothing is generated or uploaded<br>in this design prototype.</p><button class="btn primary" onclick="state.tab='align';render();toast('Sample material is ready to review. No sources were fetched.')">Review the demo ${I('arrow')}</button></div></section><aside><section class="agent-card"><div class="agent-icon">${bird()}</div><h3>Good material.<br>A better conversation.</h3><p>Your guide’s job is to make the product clear, useful and relevant. You stay in control of what it knows.</p><ul><li>${I('check')} Product facts tied to sources</li><li>${I('check')} A focused, conversational story</li><li>${I('check')} Your approval before building</li></ul><div class="sample-label">Bluebird guide · visual concept</div></section><section class="small-panel"><h3>Experience settings</h3><div class="setting-row"><span>Language</span><strong>${E(state.language)}</strong></div><div class="setting-row"><span>Guide</span><strong>Priya</strong></div><div class="setting-row"><span>Audience</span><strong>Everyday buyers</strong></div><div class="setting-row"><span>Length</span><strong>About 3 minutes</strong></div><button class="text-link" style="margin-top:9px" onclick="settings()">Edit sample settings ${I('arrow')}</button></section></aside></div>`;}
function align(){const count=state.approvals.filter(Boolean).length;return `<div class="approval-summary"><div class="agent-icon">${bird()}</div><div><strong>The story is ready for your point of view.</strong><p>Six review cards. One clear checkpoint before the demo is built.</p></div><span class="badge">${count} / 6 approved</span></div><div class="studio-layout"><section><div class="approval-grid">${approvalDefs.map(([ic,title,desc,meta],i)=>`<article class="approval-card ${state.approvals[i]?'approved':''}"><div class="approval-card-top"><div class="approval-symbol">${I(ic)}</div><span class="badge ${state.approvals[i]?'ready':''}">${state.approvals[i]?'Approved':'Needs your review'}</span></div><h3>${title}</h3><p>${desc}</p><span class="sample-label" style="display:block;margin-top:11px">${meta}</span><div class="approval-card-footer"><button class="approval-toggle" onclick="state.approvals[${i}]=!state.approvals[${i}];render()" aria-pressed="${state.approvals[i]}"><i>${state.approvals[i]?I('check'):''}</i>${state.approvals[i]?'Approved':'Approve card'}</button><button class="text-link" onclick="reviewCard(${i})">Review ${I('arrow')}</button></div></article>`).join('')}</div><div class="panel-foot"><button class="btn quiet small" onclick="state.approvals=state.approvals.map(()=>true);render();toast('All six sample cards approved in this preview.')">${I('checkcircle')} Approve all sample cards</button><button class="btn primary" ${count!==6?'disabled':''} onclick="state.built=true;state.tab='rehearse';render();toast('Sample build complete. No generation or provider calls were made.')">Build sample demo ${I('arrow')}</button></div></section><aside><section class="studio-preview"><div class="studio-preview-top"><span class="dot"></span> YOUR EXPERIENCE, TAKING SHAPE</div><img src="./assets/nexon.avif" alt="Nexon sample opening"><div class="studio-preview-copy"><div class="overline">OPENING MOMENT</div><h3>A closer look.<br>A better conversation.</h3><p>A visual preview of the story. Tap into the customer view to explore the full direction.</p><button class="btn small" onclick="openDemo()">${I('play')} Preview the experience</button></div></section><section class="small-panel"><h3>Human approval stays in place.</h3><p class="sample-label" style="font-size:10px;line-height:1.9">These sample cards mirror the existing review step. This design changes the presentation, not the core workflow.</p></section></aside></div>`;}
function rehearse(){return `<div class="review-banner">${I('checkcircle')} ${state.built?'Your sample build is ready.':'Preview a prepared sample demo.'} Nothing here has been generated or published.</div><div class="studio-layout"><section class="panel"><div class="panel-title"><div><h2>Take the customer’s seat.</h2><p>Explore the flow, ask a question and review the experience.</p></div><span class="badge">Muted preview</span></div><div class="rehearsal-large"><img src="./assets/nexon.avif" alt="Nexon rehearsal preview"><button class="play-circle" onclick="openDemo()" aria-label="Open customer demo preview">${I('play')}</button></div><div class="rehearsal-score"><div><strong>12</strong><span>sample slides</span></div><div><strong>18</strong><span>sample questions</span></div><div><strong>3 min</strong><span>illustrative runtime</span></div></div><div class="panel-foot"><span class="sample-label">The preview uses captions and scripted responses.</span><button class="btn primary" onclick="openDemo()">Enter the showroom ${I('arrow')}</button></div></section><aside><section class="small-panel feedback" style="margin-top:0"><h3>Make the experience better.</h3><p class="sample-label">Leave feedback on the local prototype.</p><textarea id="feedback" placeholder="What should feel different?" aria-label="Prototype feedback"></textarea><button class="btn small" onclick="saveFeedback()">Save sample feedback ${I('arrow')}</button></section><section class="agent-card"><div class="agent-icon">${bird()}</div><h3>Ready when<br>your customer is.</h3><p>Clear guidance, room for questions, and a natural return to the story.</p><button class="btn white small" onclick="state.tab='align';render()">Return to review ${I('back')}</button></section></aside></div>`;}
function customer(){const d=demos[state.selected]||demos[0],t=topics[state.topic];const ownImage=d.image==='nexon.avif'?t.image:d.image;return `<div class="customer-wrap"><div class="customer-header"><div class="customer-title"><button class="icon-button" aria-label="Back to Studio" onclick="state.tab='rehearse';nav('studio')">${I('back')}</button><div><h1>${E(d.name)} showroom</h1><p>YOUR PERSONAL PRODUCT EXPLORATION</p></div></div><span class="muted-pill">${I('volumeoff')} Muted · captions on</span></div><div class="showroom"><section class="showroom-main"><nav class="topic-tabs" aria-label="Demo topics">${topics.map((x,i)=>`<button class="${state.topic===i?'active':''}" onclick="setTopic(${i})"><i class="topic-dot"></i>${x.name}</button>`).join('')}</nav><div class="demo-stage ${t.class}"><img class="stage-picture" src="./assets/${ownImage}" alt="${E(d.name)} ${t.name.toLowerCase()} product view"><div class="stage-copy"><div class="stage-kicker">${String(state.topic+1).padStart(2,'0')} / ${t.name.toUpperCase()}</div><h2>${t.headline.replace(/\n/g,'<br>')}</h2><p>${t.intro}</p></div><div class="stage-pagination"><span>${String(state.topic+1).padStart(2,'0')}</span>${topics.map((x,i)=>`<i class="${i===state.topic?'active':''}"></i>`).join('')}<span>04</span></div></div><div class="caption-dock"><div class="caption-avatar">${bird()}</div><div class="caption-text"><div class="caption-meta">Priya <span class="listening-label">${state.paused?'Paused':'Your product guide'}</span></div><p>${state.paused?'Take your time. Choose a topic or ask a question whenever you’re ready.':t.caption}</p></div><div class="caption-controls"><button aria-label="${state.paused?'Resume captions':'Pause captions'}" onclick="state.paused=!state.paused;render()">${I(state.paused?'play':'pause')}</button><button aria-label="Next topic" onclick="setTopic((state.topic+1)%topics.length)">${I('arrow')}</button></div></div></section><aside class="conversation"><div class="conversation-head"><div class="caption-avatar">${bird()}</div><div><strong>Here for your questions.</strong><span>Priya · your product guide</span></div><i class="agent-live"></i></div><p class="conversation-intro">What matters to you?</p><p class="conversation-detail">Explore at your pace. Try a sample question, or choose a topic to look closer.</p>${['Show me the cabin','How does it compare?','What should I try in person?'].map((q,i)=>`<button class="question-preset" onclick="askPreset(${i})">${q}${I('arrow')}</button>`).join('')}<div class="chat-thread" id="chat-thread" aria-live="polite">${state.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${m.role==='agent'?'<strong>SCRIPTED PREVIEW</strong>':''}${E(m.text)}</div>`).join('')}</div><div class="conversation-bottom"><form class="chat-form" onsubmit="event.preventDefault();askTyped(this.elements.question.value);this.reset()"><input name="question" aria-label="Type a question for the design preview" placeholder="Ask your own question…" required><button type="submit" aria-label="Send question">${I('send')}</button></form><p>Scripted design preview · no AI, audio or microphone</p></div></aside></div><div class="showroom-bottom"><p>${I('shield')} Sample content for design review. Product claims are not live.</p><button class="btn" onclick="recap()">Your recap ${I('arrow')}</button><button class="btn primary" onclick="followup()">Explore a test drive ${I('calendar')}</button></div></div>`;}
function insights(){const weekly=state.period==='week';return `<div class="content"><div class="page-heading"><div><div class="overline">THE CONVERSATION, UNDERSTOOD</div><h1>More than a view count.</h1><p>See what customers explore, ask and do next.</p></div><button class="btn" onclick="exportSample()">${I('download')} Export sample</button></div><div class="section-heading" style="margin-top:0"><span class="badge">Illustrative metrics · no live customer data</span><button class="btn small" onclick="state.period=state.period==='week'?'month':'week';render()">${I('calendar')} ${weekly?'Last 7 days':'Last 30 days'} ${I('chevron')}</button></div><div class="metrics-row">${[['users','Conversations',weekly?'374':'1,426','', '18% above previous period'],['checkcircle','Demo completion','72','%','Customers reaching the recap'],['message','Questions asked',weekly?'812':'3,108','','2.2 questions per conversation'],['calendar','Follow-up interest',weekly?'46':'168','','Explicit sample opt-ins']].map(([ic,n,v,u,t])=>`<article class="metric"><div class="metric-name">${I(ic)}${n}</div><strong>${v}<small>${u}</small></strong><p>${t}</p></article>`).join('')}</div><div class="insights-layout"><section class="panel"><div class="panel-title"><div><h2>Curiosity is a good sign.</h2><p>Sample conversations by day</p></div><span class="badge">All experiences</span></div><div class="chart">${[42,51,38,63,49,59,72].map((v,i)=>`<div class="chart-bar" style="height:${v*1.8}px"><i>${weekly?v:v*4}</i><span>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</span></div>`).join('')}</div><div class="panel-foot"><p>Illustrative trend to demonstrate the visual direction.</p><button class="text-link" onclick="toast('The time range above toggles this illustrative chart. No live report is connected.')">Explore the pattern ${I('arrow')}</button></div></section><section class="panel"><div class="panel-title"><div><h2>What came up most?</h2><p>Sample question themes</p></div>${I('message')}</div>${[['Everyday practicality','32%'],['Comfort & cabin','26%'],['Comparison questions','23%'],['Ownership & next steps','19%']].map(([n,v],i)=>`<button class="question-row" style="width:100%;text-align:left" onclick="themeDetail(${i})"><span>${n}<br><small>View sample questions</small></span><strong>${v}</strong></button>`).join('')}</section><section class="panel"><div class="panel-title"><div><h2>A journey worth understanding.</h2><p>Illustrative customer path · conversion is not validated</p></div></div>${[['Started a demo',100,374],['Explored a topic',87,326],['Reached the recap',72,269],['Chose a follow-up',12,46]].map(([n,w,v])=>`<div class="funnel-row"><span>${n}</span><div class="funnel-track"><i style="width:${w}%"></i></div><strong>${v}</strong></div>`).join('')}</section><section class="agent-card"><div class="agent-icon">${bird()}</div><h3>Every question is<br>a chance to improve.</h3><p>Bring the questions your guide could not answer back into the review process. Better sources make better conversations.</p><button class="btn white small" onclick="state.tab='align';nav('studio')">Review your demo ${I('arrow')}</button><div class="sample-label">The existing Sources → Align → Rehearse workflow stays intact.</div></section></div><footer class="footer"><span>Designed for thoughtful conversations.</span><span>Sample data for visual review only.</span></footer></div>`;}
function setTopic(i){state.topic=i;state.paused=false;render();}
function askPreset(i){const data=[['Show me the cabin','Of course. Let’s pause here and look inside. The cabin view is now on screen; choose any other topic when you’re ready.'],['How does it compare?','A real demo would use the reviewed competitor sources and exact variants. This design preview does not make a comparison claim. We can keep exploring the product together.'],['What should I try in person?','Think about your everyday route, how the seating feels and the things you normally carry. A dealership visit can help you assess those details for yourself.']][i];state.messages.push({role:'user',text:data[0]},{role:'agent',text:data[1]});if(i===0)state.topic=2;state.paused=false;render();const chat=document.getElementById('chat-thread');if(chat)chat.scrollTop=chat.scrollHeight;}
function askTyped(q){if(!q.trim())return;state.messages.push({role:'user',text:q.trim()},{role:'agent',text:'Thanks. This is an offline design prototype, so I cannot generate an answer. Try a sample question above to preview how a reply appears, or select a topic to continue exploring.'});render();const chat=document.getElementById('chat-thread');if(chat)chat.scrollTop=chat.scrollHeight;}
function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';}
function modal(title,body,actions='',symbol='spark'){modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><div class="tip-icon">${I(symbol)}</div><button class="icon-button modal-close" aria-label="Close dialog" onclick="closeModal()">${I('close')}</button></div><h2 id="modal-title">${title}</h2>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>modalRoot.querySelector('input,textarea,select,button')?.focus(),0);}
function createDemo(){modal('Start something worth exploring.','<p>Create a local sample experience. This adds a card to the collection; it does not generate or upload a demo.</p><form id="create-form" onsubmit="event.preventDefault();saveNewDemo()"><div class="field"><label for="demo-name">Product or experience name</label><input id="demo-name" placeholder="e.g. Your next product" maxlength="70" required><small>A name helps your team find the experience.</small></div><div class="field"><label for="demo-type">Sample product image</label><select id="demo-type"><option value="0">Tata Nexon</option><option value="1">TVS iQube</option><option value="2">Audi Q5</option></select></div></form>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit" form="create-form">Create local demo '+I('arrow')+'</button>','plus');}
function saveNewDemo(){const name=document.getElementById('demo-name').value.trim();if(!name)return;const sample=demos[Number(document.getElementById('demo-type').value)];demos.push({name,type:'Sample experience',image:sample.image,class:sample.class,status:'Draft',time:'3 min',sessions:'0'});state.search='';closeModal();nav('workspace');toast('A new sample card has been added to this tab.');}
function demoOptions(i){const d=demos[i];modal(E(d.name),'<p>Choose where to explore this sample experience.</p>',`<button class="btn" onclick="closeModal();openStudio(${i})">Open studio</button><button class="btn primary" onclick="closeModal();openDemo(${i})">Preview demo ${I('play')}</button>`,'layers');}
function addSource(){modal('Add to the product story.','<p>Choose a sample source to add locally. No files are uploaded and no websites are fetched.</p>'+[['file','Ownership guide.pdf','Sample document · service and care'],['image','Interior detail collection','Sample photos · seats and controls'],['link','Additional comparison reference','Sample link · variant information']].map(([ic,n,m],i)=>`<button class="source-choice" onclick="addSampleSource(${i})"><div class="file-icon">${I(ic)}</div><span><strong>${n}</strong><small>${m}</small></span>${I('plus')}</button>`).join(''),'','upload');}
function addSampleSource(i){const samples=[{name:'Ownership guide.pdf',meta:'Sample document · service and care',kind:'file',badge:'Added'},{name:'Interior detail collection',meta:'Sample photos · seats and controls',kind:'image',badge:'Added'},{name:'Additional comparison reference',meta:'Sample link · variant information',kind:'link',badge:'Added'}];state.sources.push(samples[i]);closeModal();render();toast('Sample source added locally.');}
function sourceDetail(i){const s=state.sources[i];modal(E(s.name),`<p>${E(s.meta)}. This row is illustrative, not a fetched or uploaded source.</p><div class="field"><label>Source label</label><input id="source-label" value="${E(s.name)}" maxlength="90"></div><div class="review-banner">${I('shield')} Production content would retain its source evidence through review.</div>`,`<button class="btn" onclick="state.sources.splice(${i},1);closeModal();render();toast('Sample source removed.')">Remove</button><button class="btn primary" onclick="saveSource(${i})">Save local label</button>`,s.kind);}
function saveSource(i){const name=document.getElementById('source-label').value.trim();if(!name)return;state.sources[i].name=name;closeModal();render();toast('Sample source label updated.');}
function reviewCard(i){const [ic,title,desc,meta]=approvalDefs[i];const sample=['Every factual claim should retain its supporting source and conditions. This prototype displays the review structure without asserting live vehicle specifications.','Opening: Welcome. We can explore the design, look inside, or focus on what matters to your everyday drive.\n\nCheck-in: What would you like to look at more closely?','Opening → Design → Cabin → Practicality. Product photography leads the story, with evidence connected to the topic.','Guide: Priya\nLanguage: English\nStyle: Warm, clear and attentive.\nPlayback: Muted captions in this prototype.','The customer chooses whether to request follow-up. No phone number or contact details are sent from this prototype.','Supported questions use reviewed material. Questions outside that material should acknowledge the limit and offer a choice to continue.'];modal('Review '+title.toLowerCase(),`<p>${desc} Changes here are local sample edits only.</p><div class="field"><label for="review-text">${title} · ${meta}</label><textarea id="review-text">${E(state.reviewText[i]??sample[i])}</textarea></div>`,`<button class="btn" onclick="closeModal()">Back to review</button><button class="btn primary" onclick="state.reviewText[${i}]=document.getElementById('review-text').value;state.approvals[${i}]=true;closeModal();render();toast('Sample review approved. No production content changed.')">Approve sample ${I('check')}</button>`,ic);}
function saveFeedback(){const text=document.getElementById('feedback').value.trim();if(!text){toast('Add a note first.');return;}state.feedback.push(text);document.getElementById('feedback').value='';toast('Feedback noted in this preview. It has not been sent anywhere.');}
function settings(){modal('Make it feel like you.',`<p>These settings are local to this design preview. They do not configure the live app.</p><div class="field"><label for="workspace-label">Workspace name</label><input id="workspace-label" value="${E(state.workspaceName)}"></div><div class="field"><label for="sample-language">Guide language</label><select id="sample-language"><option ${state.language==='English'?'selected':''}>English</option><option ${state.language==='Hindi'?'selected':''}>Hindi</option></select><small>The scripted captions remain English in this prototype.</small></div>`,'<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSettings()">Save preview</button>','settings');}
function saveSettings(){state.workspaceName=document.getElementById('workspace-label').value.trim()||'Personal workspace';state.language=document.getElementById('sample-language').value;closeModal();render();toast('Preview settings saved in this tab. No app configuration changed.');}

function help(){modal('A clearer way to explore.','<p>Bluebird is one possible design direction for Demo Studio. Its crisp blue and white workspace keeps the product professional, approachable and easy to navigate.</p><div class="source-list"><div class="source-row"><div class="file-icon">1</div><div><strong>Sources</strong><small>Add product materials for the guide.</small></div></div><div class="source-row"><div class="file-icon">2</div><div><strong>Align</strong><small>Review the six cards and approve the story.</small></div></div><div class="source-row"><div class="file-icon">3</div><div><strong>Rehearse</strong><small>Try the experience as a customer.</small></div></div></div><p style="margin-top:20px">Every interaction here is local. No live app, providers, uploads, audio or microphone are connected.</p>','<button class="btn primary" onclick="closeModal()">Got it '+I('check')+'</button>','help');}
function recap(){modal('Your exploration, at a glance.',`<p>You are exploring the sample ${(E(demos[state.selected]?.name||'Nexon'))} showroom. This is an illustrative recap, not a saved customer session.</p><div class="source-list"><div class="source-row"><div class="file-icon">${I('eye')}</div><div><strong>Current topic</strong><small>${topics[state.topic].name}</small></div></div><div class="source-row"><div class="file-icon">${I('message')}</div><div><strong>Questions in this preview</strong><small>${state.messages.filter(x=>x.role==='user').length} questions · scripted responses only</small></div></div><div class="source-row"><div class="file-icon">${I('shield')}</div><div><strong>Your next step is your choice.</strong><small>No contact details have been requested or sent.</small></div></div></div>`,`<button class="btn" onclick="closeModal()">Keep exploring</button><button class="btn primary" onclick="closeModal();nav('workspace')">Done ${I('check')}</button>`,'checkcircle');}
function followup(){modal('Try it in your own time.','<p>A real customer could choose a dealership follow-up here. This prototype only previews that choice and never sends a request.</p><div class="field"><label for="visit-option">What would you like to explore?</label><select id="visit-option"><option>Experience a test drive</option><option>Discuss a selected variant</option><option>Ask about ownership</option></select></div><div class="review-banner">'+I('shield')+' No personal details or leads are collected.</div>','<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="closeModal();toast(\'Sample preference confirmed. No request was sent.\')">Confirm sample choice</button>','calendar');}
function themeDetail(i){const data=[['Everyday practicality','Will the things I usually carry fit comfortably?','Can we take a closer look at the boot?'],['Comfort & cabin','Show me the driver’s seat.','What should I check for rear-seat comfort?'],['Comparison questions','Which exact variants are we comparing?','What does the reviewed competitor source say?'],['Ownership & next steps','What should I try on a test drive?','Where can I confirm the full written terms?']][i];modal(data[0],'<p>Illustrative customer questions. These are sample prompts for the design direction, not live customer records.</p>'+data.slice(1).map(q=>`<div class="bubble" style="margin:12px 0">${E(q)}</div>`).join(''),'<button class="btn primary" onclick="closeModal();state.tab=\'align\';nav(\'studio\')">Review the sample answers '+I('arrow')+'</button>','message');}
function exportSample(){const csv='Metric,Sample value,Note\nConversations,374,Illustrative only\nCompletion,72%,Illustrative only\nQuestions,812,Illustrative only\nFollow-up interest,46,Illustrative only\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='bluebird-illustrative-metrics.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Illustrative metrics exported. No real customer data.');}
