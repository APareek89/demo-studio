omer to answer.</p><blockquote>“Let’s look at that together. Is there a particular detail you want to start with?”</blockquote><span class="pill blue">Caption-only prototype</span>';return '<p>A helpful conclusion gives the customer a choice. Nothing is submitted automatically.</p>'+evidence('01','Explore another detail','Return to the conversation')+evidence('02','Save a recap','Review what mattered')+evidence('03','Request a test drive','Only after an explicit customer choice')}

"return-demo">That helps. Back to the demo '+ico('arrow','small')+'</button>':'<p class="chat-intro">Ask a question whenever you like. We’ll pause the story and come back to it when you’re ready.</p><button class="suggestion" data-question="Can we look inside?">Can we look inside?</button><button class="suggestion" data-question="How does this compare with the Venue?">How does this compare with the Venue?</button><button class="suggestion" data-question="What should I check on a test drive?">What should I check on a test drive?</button>')+'</div><form class="ask-form" id="ask-form"><label class="sr-only" for="question">Ask the product guide</label><div class="ask-row"><input id="question" placeholder="Ask a question…" autocomplete="off"><button class="ask-submit" aria-label="Send question">'+ico('send','small')+'</button></div><small>Local scripted interaction · no microphone or AI calls</small></form></aside></div><div class="approval-strip" style="margin-top:17px">'+ico('shield')+'<div><p>Your next step is your choice.</p><small>Continue exploring, or leave a sample request to experience the handoff.</small></div>'+button('Request a test drive','interest','arrow')+'</div>'+foot()}
function renderInsights(){return header('Insights / Customer experience','See the quality behind the conversation.','A precise view of response time, useful answers and the moments that need attention.',button(state.window,'date','clock')+button('Export sample','export','download'))+'<div class="metrics">'+metric('Median response time',state.window==='7 days'?'3.0<small>s</small>':'3.2<small>s</small>','Illustrative question → first answer','clock')+metric('Source-backed answers','86<small>%</small>','Answered within available evidence','shield')+metric('Demo completion','72<small>%</small>','Sample completed conversations','checkCircle')+metric('Follow-up requests','34','Explicit choices · sample only','users')+'</div><div class="insight-grid"><section class="panel"><div class="panel-head"><div><h2>Response performance</h2><p>Useful answers, without losing the conversation.</p></div><span class="pill blue">Sample data</span></div><div class="panel-body"><div class="graph-toolbar"><div class="chart-summary"><strong>'+(state.chart==='Response time'?'3.2<span style="font-size:12px"> s</span>':'212')+'</strong><span>'+(state.chart==='Response time'?'median answer latency':'sample conversations')+'</span></div><div class="segmented"><button class="'+(state.chart==='Response time'?'active':'')+'" data-chart="Response time">Response time</button><button class="'+(state.chart==='Sessions'?'active':'')+'" data-chart="Sessions">Sessions</button></div></div>'+graph(true)+'<div class="chart-labels"><span>19 AUG</span><span>26 AUG</span><span>02 SEP</span><span>09 SEP</span><span>18 SEP</span></div><div class="legend" style="margin-top:19px"><span><i></i>'+(state.chart==='Response time'?'Median response':'This period')+'</span><span><i class="soft"></i>'+(state.chart==='Response time'?'Cached answers':'Previous period')+'</span></div></div></section><section class="panel"><div class="panel-head"><div><h2>What customers explore</h2><p>Every question is a signal.</p></div>'+ico('message','small')+'</div><div class="panel-body"><div class="chart-summary"><strong>318</strong><span>sample questions</span></div><div class="distribution">'+[['Features & equipment',82,32],['Ownership',66,26],['Comparisons',55,21],['Safety',33,13],['Other questions',21,8]].map(([name,w,n])=>'<div class="distribution-row"><span>'+name+'</span><span class="distribution-track"><i style="width:'+w+'%"></i></span><span>'+n+'%</span></div>').join('')+'</div><div class="source-note">A useful answer has to be supported and relevant. A fast decline does not count as a resolved question.</div></div></section></div><section class="panel insight-detail"><div class="panel-head"><div><h2>Recent answer traces</h2><p>From the customer’s question to the guide’s response.</p></div><select class="insight-select" id="trace-filter" aria-label="Filter sample traces"><option value="all">All sample answers</option><option value="answered">Source-backed</option><option value="open">Needs follow-up</option></select></div><div class="table-wrap"><table class="trace-table"><thead><tr><th>Question</th><th>Experience</th><th>Outcome</th><th>Response time</th><th>Source</th><th></th></tr></thead><tbody id="traces">'+traceRows('all')+'</tbody></table></div><div class="table-foot"><span>Illustrative values · no live performance data</span><button class="button quiet small" data-action="metrics">How these metrics work '+ico('arrow','small')+'</button></div></section>'+foot()}
function traceRows(filter){return [['What does this variant include?','Tata Nexon','Source-backed','green','2.8 s','Reviewed FAQ','answered'],['How much space is there inside?','TVS iQube','Source-backed','green','3.1 s','Product facts','answered'],['What are the warranty exclusions?','Tata Nexon','Needs follow-up','amber','3.7 s','Open question','open']].filter(x=>filter==='all'||x[6]===filter).map((x,i)=>'<tr><td>'+x[0]+'</td><td class="muted">'+x[1]+'</td><td><span class="pill '+x[3]+'">'+x[2]+'</span></td><td class="mono">'+x[4]+'</td><td class="muted">'+x[5]+'</td><td><button class="icon-button" data-action="trace" data-trace="'+esc(x[0])+'" aria-label="Inspect sample answer">'+ico('chevron','small')+'</button></td></tr>').join('')}
function render(){renderNav();$('#content').innerHTML=state.route==='workspace'?renderWorkspace():state.route==='studio'?renderStudio():state.route==='preview'?renderPreview():renderInsights();document.title='C · Control Room / '+({workspace:'Workspace',studio:'Studio',preview:'Customer preview',insights:'Insights'}[state.route]);document.querySelectorAll('[data-route]').forEach(n=>{if(n.closest('.rail-nav')&&n.dataset.route===state.route)n.setAttribute('aria-current','page')})}
function go(route){state.route=route;render();window.scrollTo({top:0,behavior:'instant'})}
function answer(question){const q=question.trim();if(!q)return;if(!state.answer)state.returnTopic=state.topic;state.question=q;state.paused=true;if(/inside|cabin|interior|space/i.test(q)){state.answer='Of course. Let’s take a closer look at the cabin. Is your priority the driving position, space for passengers, or storage for everyday use?';state.topic=1}else if(/venue|compare|brezza|competition/i.test(q)){state.answer='Let’s keep the comparison useful to you. Are you weighing cabin comfort, equipment in the chosen variants, or everyday driving? We can focus on one and keep the source limitations clear.'}else if(/test|drive/i.test(q)){state.answer='Start with what matters in your everyday use: your seating position, visibility, cabin space and the feel of the drive. Is there one concern you would especially like to check?'}else{state.answer='Let’s be precise about that. I’d want to check the selected variant and the supporting source before giving you an answer. We can keep this question open while you explore another detail.'}render()}
function action(name,el){switch(name){case'close':closeModal();break;case'profile':modal('Your sample workspace','<p><strong>Anand Pareek</strong><br>Product workspace · Demo Studio</p><p>This profile is illustrative. No account or settings are connected to this design prototype.</p>',button('Done','close','','primary'));break;case'notes':modal('C · Control Room','<p>A precise operating environment for teams creating customer conversations. Compact navigation, close-to-source review, restrained colour and a clear distinction between creation and presentation.</p><ul class="modal-list"><li>Workspace, Studio, Customer preview and Insights are interactive.</li><li>The Sources → Align → Rehearse workflow remains intact.</li><li>All metrics, responses and approvals are sample or local state.</li><li>No backend, AI, microphone, audio or production writes.</li><li>Reloading resets the prototype.</li></ul>',button('Keep exploring','close','','primary'));break;case'activity':modal('Recent workspace activity','<div class="timeline">'+event('shield','Visual direction approved','Tata Nexon · 12 minutes ago')+event('users','Customer conversation completed','TVS iQube · 38 minutes ago')+event('file','Source references added','Tata Nexon · 1 hour ago')+'</div><p>Sample activity, provided only to demonstrate the design.</p>',button('Close','close'));break;case'portfolio':go('workspace');setTimeout(()=>$('#portfolio')?.scrollIntoView({block:'start',behavior:'smooth'}),0);break;case'align':state.step='align';go('studio');break;case'rehearse':state.step='rehearse';go('studio');break;case'preview':go('preview');break;case'sessions':modal('Customer conversations','<p>A sample view of the context a team can review after a demo.</p>'+evidence('01','Exploring family practicality','Tata Nexon · 6 min · recap available')+evidence('02','Comparing everyday options','TVS iQube · 4 min · recap available')+evidence('03','Warranty clarification requested','Tata Nexon · open question')+'<div class="source-note">Sample conversation: “I’m exploring an automatic for daily driving.” The guide kept the question open and offered a customer-led next step.</div>',button('Open insights','to-insights','chart','primary'));break;case'to-insights':closeModal();go('insights');break;case'search':modal('Find an experience','<div class="field"><label for="search-modal">Product name</label><input id="search-modal" placeholder="Tata Nexon, TVS iQube, Audi…"></div>',button('Search portfolio','do-search','search','primary'));break;case'do-search':state.search=$('#search-modal').value;closeModal();go('workspace');break;case'filter':state.filter=state.filter==='all'?'ready':state.filter==='ready'?'progress':'all';$('#portfolio-table').innerHTML=portfolioTable();toast('Portfolio filter: '+({all:'all experiences',ready:'ready to present',progress:'in progress'}[state.filter]));break;case'date':state.window=state.window==='30 days'?'7 days':'30 days';if(state.route==='insights')render();else el.innerHTML=ico('clock','small')+'Last '+state.window;toast('Sample date range: last '+state.window);break;case'new':modal('Create a sample experience','<p>Try the start of the workflow. This creates a local sample card only.</p><div class="field"><label for="new-name">Product name</label><input id="new-name" placeholder="e.g. Your next product" maxlength="70"></div>',button('Cancel','close')+button('Create sample','create-sample','plus','primary'));break;case'create-sample':{const name=$('#new-name').value.trim();if(!name){$('#new-name').focus();return}state.extraDemos.unshift({name,sub:'New local sample · English',img:'side.avif',status:'Draft',kind:'amber',sessions:'—',updated:'Just now',action:'Continue'});state.search='';state.filter='all';closeModal();go('workspace');toast('Local sample created. Production data is unchanged.');break}case'open-demo':if(el.dataset.name==='Tata Nexon'){state.step='align';go('studio')}else if(el.dataset.name==='TVS iQube'){modal('TVS iQube · sample overview','<img src="./assets/iqube.jpg" alt="TVS iQube" style="width:100%;height:175px;object-fit:contain;border-radius:6px;background:#f5f8fb"><p>Ready to present · 84 illustrative sessions</p><p>The interactive end-to-end design is represented by the Nexon experience in this prototype.</p>',button('Explore the sample player','to-preview','play','primary'))}else{modal(el.dataset.name,'<p>This is a draft in the sample portfolio. The detailed Sources → Align → Rehearse flow is available through the Nexon example.</p>',button('Open sample Studio','to-studio','layers','primary'))}break;case'to-preview':closeModal();go('preview');break;case'to-studio':closeModal();state.step='sources';go('studio');break;case'add-source':modal('Add a source reference','<p>Add a local placeholder to see how the Sources list grows. No file or URL is fetched.</p><div class="field"><label for="source-name">Document title or website</label><input id="source-name" placeholder="e.g. Product specification sheet"></div>',button('Cancel','close')+button('Add placeholder','save-source','plus','primary'));break;case'save-source':{const v=$('#source-name').value.trim();if(!v){$('#source-name').focus();return}state.sources.push(['file',v,'Local placeholder · not read or uploaded']);closeModal();render();toast('Source placeholder added locally.');break}case'source-detail':{const s=state.sources[Number(el.dataset.source)];modal(s[1],'<p>'+esc(s[2])+'</p><div class="source-note">Included in the sample source list. In the working app, source material is read once and then reviewed at Align. This prototype does not open or fetch the reference.</div>',button('Done','close','','primary'));break}case'read':state.step='align';go('studio');toast('Sample draft opened. No material was processed.');break;case'settings':modal('Experience settings','<p>Local settings preview for Tata Nexon.</p><div class="field"><label for="settings-language">Language</label><select id="settings-language"><option>English · India</option><option>Hindi · India</option></select></div><div class="field"><label for="settings-audience">Audience</label><select id="settings-audience"><option>Everyday customers</option><option>Detailed product explorers</option></select></div><div class="field"><label for="settings-duration">Pitch length</label><select id="settings-duration"><option>About 3 minutes</option><option>About 5 minutes</option></select></div>',button('Cancel','close')+button('Save local selection','save-settings','check','primary'));break;case'save-settings':closeModal();toast('Sample selections acknowledged. This prototype stays in English.');break;case'review-history':modal('Review history','<div class="timeline">'+event('image','Visual direction approved','6 product images selected · sample')+event('agent','Guide identity approved','Priya · English · sample')+event('edit','Narrative shortened','Opening revised for a focused start · sample')+'</div>',button('Back to review','close','','primary'));break;case'ask-agent':modal('Ask your alignment agent','<p>In the working app, this is where feedback refines the draft. Try a local note here.</p><div class="field"><label for="agent-note">Your note</label><textarea id="agent-note" placeholder="e.g. Keep the opening warm and concise."></textarea></div>',button('Save sample note','save-note','send','primary'));break;case'save-note':closeModal();toast('Sample note recorded for this design walkthrough. No agent call made.');break;case'edit-review':modal('Suggest a change · '+reviewCards.find(c=>c.id===state.review).name,'<p>Edit the local review note. Saving it reopens this card for approval.</p><div class="field"><label for="review-note">Review note</label><textarea id="review-note">'+esc(state.drafts[state.review]||'Keep the content focused on the selected variant and preserve the source qualifications.')+'</textarea></div>',button('Cancel','close')+button('Save local draft','save-review','check','primary'));break;case'save-review':state.drafts[state.review]=$('#review-note').value.trim();state.approved.delete(state.review);closeModal();render();toast('Local draft saved. Review approval cleared.');break;case'approve':if(state.approved.has(state.review)){state.approved.delete(state.review);toast('Approval removed locally.')}else{state.approved.add(state.review);toast(reviewCards.find(c=>c.id===state.review).name+' approved in this prototype.')}render();break;case'build':if(state.approved.size<6)return;state.built=true;state.step='rehearse';go('studio');toast('Local rehearsal is ready. No real Build or model call occurred.');break;case'feedback':modal('Leave rehearsal feedback','<p>Capture an observation about the customer experience.</p><div class="field"><label for="feedback-note">Your feedback</label><textarea id="feedback-note" placeholder="What would make this conversation better?"></textarea></div>',button('Save sample feedback','save-note','check','primary'));break;case'restart':state.topic=0;state.returnTopic=0;state.paused=false;state.question='';state.answer='';render();toast('Caption-only preview restarted.');break;case'pause':state.paused=!state.paused;render();break;case'next-topic':state.topic=(state.topic+1)%topics.length;state.paused=false;render();break;case'return-demo':state.topic=state.returnTopic;state.question='';state.answer='';state.paused=false;render();break;case'interest':modal('A next step, on your terms','<p>This handoff demonstrates an explicit customer choice. Nothing is sent to a dealership, and no contact details are collected.</p><div class="source-note">Sample request<br><strong>I would like to explore a test drive.</strong><br>Review the questions you want to take with you before making a commitment.</div>',button('Keep exploring','close')+button('Confirm sample interest','confirm-interest','check','primary'));break;case'confirm-interest':closeModal();toast('Sample interest confirmed. No lead or request was submitted.');break;case'export':{const csv='Design prototype — illustrative sample data only\nMetric,Sample value\nCustomer sessions,212\nMedian response seconds,3.2\nSource-backed answers,86%\nFollow-up interest,34\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='control-room-sample-insights.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Illustrative sample metrics exported.');break}case'trace':modal('Sample answer trace','<p><strong>'+esc(el.dataset.trace)+'</strong></p>'+evidence('01','Customer question received','Sample timestamp · 00:00.0')+evidence('02','Approved knowledge checked','Reviewed fact or FAQ · sample only')+evidence('03','Answer or limitation presented','Captions shown · no generated voice')+'<div class="source-note">An actual trace should preserve source conditions, response timing and the exact answer shown to the customer.</div>',button('Close trace','close','','primary'));break;case'metrics':modal('Useful answers are the measure','<ul class="modal-list"><li><strong>Response time:</strong> question submitted to first useful answer, excluding filler.</li><li><strong>Source-backed answers:</strong> responses supported by approved references.</li><li><strong>Completion:</strong> conversations reaching the normal closing.</li><li><strong>Follow-up:</strong> an explicit customer choice, never an inferred intention.</li></ul><p>Every value on this page is illustrative, not measured performance.</p>',button('Understood','close','','primary'));break}}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route);return}const step=e.target.closest('[data-step]');if(step){state.step=step.dataset.step;go('studio');return}const review=e.target.closest('[data-review]');if(review){state.review=review.dataset.review;render();return}const topic=e.target.closest('[data-topic]');if(topic){state.topic=Number(topic.dataset.topic);state.paused=false;render();return}const q=e.target.closest('[data-question]');if(q){answer(q.dataset.question);return}const chart=e.target.closest('[data-chart]');if(chart){state.chart=chart.dataset.chart;render();return}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action,act);return}if(e.target.classList.contains('modal-bg'))closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='portfolio-search'){state.search=e.target.value;$('#portfolio-table').innerHTML=portfolioTable()}});
document.addEventListener('change',e=>{if(e.target.id==='trace-filter')$('#traces').innerHTML=traceRows(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='ask-form'){e.preventDefault();answer($('#question').value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.modal-bg'))closeModal();const m=$('.modal');if(m&&e.key==='Tab'){const nodes=[...m.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0]?.focus()}}});
render();
</script>
</body>
</html>
