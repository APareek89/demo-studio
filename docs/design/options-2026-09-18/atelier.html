function studio(){const titles={sources:['Start with the truth.','Give your guide the product knowledge and visual material it needs.'],align:['A story, worth getting right.','Six thoughtful checkpoints before your experience meets a customer.'],rehearse:['See it through their eyes.','Explore the experience as your customer would, then refine the details.']};return `<main class="page studio-page"><div class="studio-crumb"><button class="text-link" data-action="nav" data-page="home">${icon('back',13)} Workspace</button><span>/</span><span>${esc(state.product)}</span><span>/</span><span>Studio</span></div><div class="studio-heading"><div><div class="label blue">The workbench / ${state.stage}</div><h1 class="page-title">${titles[state.stage][0]}</h1><p>${titles[state.stage][1]} This is a local design simulation.</p></div><div class="product-chip"><img src="./assets/nexon.avif" alt="Nexon"><div><strong>${esc(state.product)}</strong><span>Sample experience · English</span></div></div></div><nav class="stage-nav" aria-label="Demo creation workflow">${[['sources','Sources','Knowledge & visual material'],['align','Align','Review the six checkpoints'],['rehearse','Rehearse','Experience & refine']].map(([k,t,d],i)=>`<button class="stage-tab ${state.stage===k?'on':''}" data-action="stage" data-stage="${k}" aria-current="${state.stage===k?'step':'false'}"><span class="num">0${i+1}</span><span><strong>${t}</strong><small>${d}</small></span>${(k==='sources'&&state.read)||(k==='align'&&state.approved.size===6)?icon('check',15,'check'):''}</button>`).join('')}</nav>${state.stage==='sources'?sources():state.stage==='align'?align():rehearse()}${footer()}</main>`}
function sources(){return `<section class="sources-layout"><div><div class="section-title"><h2>The source library.</h2><span class="count">${state.sources.length} sample collections</span></div><div class="source-drop" id="source-drop"><span class="upload-mark">${icon('upload',21)}</span><div><h3>Bring your product into focus.</h3><p>Drop files here. Only filenames are added to this local mock.</p></div><button class="btn light small" data-action="files">Choose files ${icon('plus',12)}</button></div><div class="source-list">${state.sources.map((s,i)=>`<div class="source-row">${icon(s.kind,20,'file-mark')}<div class="source-meta"><strong title="${esc(s.name)}">${esc(s.name)}</strong><small>${esc(s.detail)}</small></div><span class="tag">${esc(s.status)}</span><button class="circle-btn" data-action="remove-source" data-index="${i}" aria-label="Remove ${esc(s.name)} from this sample">${icon('close',12)}</button></div>`).join('')||'<div class="empty-note">The library is clear. Add a local filename, a sample URL or brand notes to continue.</div>'}</div><div class="add-source-row"><button class="text-link" data-action="add-url">${icon('link',14)} Add a page</button><button class="text-link" data-action="brand-notes">${icon('file',14)} Brand notes</button></div><div class="source-controls"><p>Next, your guide prepares the facts, visuals and story for your approval. No real source processing happens in this prototype.</p><button class="btn primary" data-action="read" ${!state.sources.length?'disabled':''}>Prepare for review ${icon('arrow',17)}</button></div></div><aside class="editorial-aside"><div class="label">A clear beginning</div><div class="aside-figure"><img src="./assets/side.avif" alt="Tata Nexon side profile"></div><h3>Good stories begin with good sources.</h3><p>Give the guide the same material you would give a thoughtful salesperson: a product brief, a clear view and the details that matter.</p><div class="setting-line"><span>Audience</span><button data-action="setting" data-setting="audience">${esc(state.audience)} ${icon('chevron',11)}</button></div><div class="setting-line"><span>Language</span><button data-action="setting" data-setting="language">${esc(state.language)} ${icon('chevron',11)}</button></div><div class="setting-line"><span>Guide</span><button data-action="setting" data-setting="voice">${esc(state.voice)} ${icon('chevron',11)}</button></div><div class="aside-note">${icon('shield',13)}<span>Sample material only. No files are uploaded, read or sent to a model.</span></div></aside></section>`}
function align(){return `<section class="review-layout"><aside><nav class="review-index" aria-label="Six review checkpoints">${cards.map(([key,name],i)=>`<button class="${state.review===key?'on':''}" data-action="review" data-card="${key}" aria-current="${state.review===key?'true':'false'}"><span class="rnum">0${i+1}</span><span class="rname">${name}</span>${icon(state.approved.has(key)?'check':'chevron',14,'rstate '+(state.approved.has(key)?'approved':''))}</button>`).join('')}</nav><div class="review-explanation"><b>Your judgement belongs in the loop.</b><br>Approve each checkpoint to unlock the local rehearsal. These choices affect this mock only.</div></aside><div class="review-panel">${reviewBody()}<div class="review-bottom"><p>Review the sample content and mark this checkpoint when it feels ready.</p><button class="btn ${state.approved.has(state.review)?'light':'primary'}" data-action="approve">${state.approved.has(state.review)?'Reopen this review':'Approve '+cards.find(c=>c[0]===state.review)[1].toLowerCase()} ${icon(state.approved.has(state.review)?'edit':'check',15)}</button></div></div></section><div class="approval-bar"><div class="approval-progress"><span style="width:${state.approved.size/6*100}%"></span></div><div><strong>${state.approved.size} of 6 checkpoints approved</strong><p>${state.approved.size===6?'The sample is ready for a rehearsal.':'Every checkpoint needs your approval.'}</p></div><button class="btn primary" data-action="build" ${state.approved.size!==6?'disabled':''}>Build local preview ${icon('arrow',16)}</button></div>`}
function reviewTitle(name,desc){return `<div class="section-title"><h2>${name}</h2><span class="tag ${state.approved.has(state.review)?'green':''}">${state.approved.has(state.review)?'Approved locally':'Your review'}</span></div><p class="description">${desc}</p>`}
function reviewBody(){switch(state.review){case'visuals':return reviewTitle('A visual point of view.','The guide pairs the story with the right view of the product. Open any image to see the detail before approving the visual direction.')+`<div class="review-images">${visualItems.map(([f,n])=>`<button class="review-image" data-action="image" data-image="${f}" data-title="${n}"><img src="./assets/${f}" alt="${n}"><span>${n}</span></button>`).join('')}</div><div class="review-note">Illustrative visual selection. A product image should show the detail being discussed; a general exterior image is not proof of a specific feature.</div>`;case'facts':return reviewTitle('Confidence in the detail.','A sample evidence registry shows how approved knowledge would be presented. The entries below illustrate the review interface; they are not verified specifications.')+`<table class="facts"><thead><tr><th>Reference</th><th>Sample evidence item</th><th>Review note</th></tr></thead><tbody><tr><td>F001</td><strong>Product identity</strong><br>Tata Nexon, selected configuration</td><td>Confirm the exact variant and model year.</td></tr><tr><td>F002</td><strong>Cabin equipment</strong><br>Features applicable to the selected trim</td><td>Check the source wording and conditions.</td></tr><tr><td>F003</td><strong>Ownership information</strong><br>Warranty and service terms</td><td>Keep any unverified relationship open.</td></tr><tr><td>F004</td><strong>Competitive context</strong><br>Official competitor references</td><td>Preserve the checked date and variant.</td></tr></tbody></table><div class="review-note">The live product’s “no citation, no claim” rule stays intact. This design study does not change evidence processing.</div>`;case'script':return reviewTitle('A conversation, composed.','Short, considered chapters leave room for the customer to steer. This sample script can be edited locally.')+`<div class="timeline-line"><span class="duration">0:15</span><div><h3>The invitation</h3><p>${esc(state.script)}</p></div><button class="btn ghost small" data-action="edit-script">${icon('edit',13)} Edit</button></div><div class="timeline-line"><span class="duration">0:25</span><div><h3>A closer look</h3><p>We move from the first impression into the cabin, using the customer’s priorities to choose what to explore.</p></div><span class="tag plain">Sample chapter</span></div><div class="timeline-line"><span class="duration">0:10</span><div><h3>A useful next step</h3><p>What would help you decide whether this belongs on your shortlist? We can revisit a detail or make a test-drive checklist.</p></div><span class="tag plain">Sample chapter</span></div><div class="review-note">The real workflow is unchanged: the approved words lead the demo, and the screen follows the conversation.</div>`;case'faq':return reviewTitle('Ready for the questions.','The sample bank demonstrates clear, useful answers and honest boundaries. Open a question to review its sample response.')+[['Can you help me compare variants?','Yes. We would start with the exact variants and the approved source material. This visual prototype does not retrieve live specifications.'],['What should I check on a test drive?','Try the seating, controls, visibility and the way the vehicle feels on your usual type of road. Your needs should shape the checklist.'],['What if the answer is not in the sources?','The guide says what is missing and offers an optional follow-up. It should not turn uncertainty into a product claim.']].map(([q,a],i)=>`<div class="faq-row"><button data-action="faq" data-index="${i}" aria-expanded="${state.faqOpen===i}">${q}${icon(state.faqOpen===i?'close':'plus',14)}</button>${state.faqOpen===i?`<p>${a}</p>`:''}</div>`).join('');case'voice':return reviewTitle('A guide with presence.','Warm, unhurried and clear. The visual identity supports the conversation without competing with the product.')+`<div class="voice-card"><span class="agent-stamp">${icon('agent',27)}</span><div><h3>${esc(state.voice)}, your guide.</h3><p>Sample persona · ${esc(state.language)} · captions only</p><button class="text-link" data-action="voice-preview">Read the introduction ${icon('arrow',13)}</button></div></div><blockquote class="voice-quote">“Take a moment. Tell me what you need, and we’ll explore that together.”</blockquote><div class="review-note">This prototype never plays audio or accesses a microphone. Voice tone is represented through the sample captions.</div>`;case'actions':return reviewTitle('A next step, freely chosen.','The guide offers a clear invitation. The customer decides when to take it; no automatic booking or contact submission is simulated.')+`<label class="action-choice"><input type="checkbox" data-toggle="drive" ${state.actions.drive?'checked':''}><div><strong>Plan a test drive</strong><small>Primary invitation at the end of the tour</small></div><span class="tag blue">Primary</span></label><label class="action-choice"><input type="checkbox" data-toggle="callback" ${state.actions.callback?'checked':''}><div><strong>Ask for a follow-up</strong><small>For a detail the guide cannot answer</small></div><span class="tag">Optional</span></label><div class="review-note">Your selection is local to this prototype. The booking preview makes no appointment and collects no contact details.</div>`;default:return''}}
function rehearse(){return `<section class="rehearsal-layout"><div><div class="rehearsal-preview"><img src="./assets/nexon.avif" alt="Tata Nexon preview"><span class="preview-mute">${icon('mute',12)} Muted · caption preview</span><div class="preview-caption">“Tell me what matters to you. We’ll start there.”</div></div><div class="rehearsal-actions"><button class="btn primary" data-action="experience">Enter the customer experience ${icon('play',14)}</button><button class="text-link" data-action="stage" data-stage="align">Back to the review ${icon('back',13)}</button></div><div class="review-checks"><span>${icon('check',12)} Caption interaction</span><span>${icon('check',12)} Questions & return</span><span>${icon('check',12)} Local sample only</span></div></div><aside class="feedback-panel"><div class="label">The finishing touches</div><h3 style="margin-top:10px">What feels right?<br>What could be better?</h3><p>Explore the sample, then leave yourself a note. Feedback is shown in this page only; no model or rebuild is triggered.</p><label class="visually-hidden" for="feedback-text">Local rehearsal feedback</label><textarea id="feedback-text" placeholder="The opening could feel a little more personal…"></textarea><button class="btn light" data-action="feedback">Save a local note ${icon('plus',13)}</button>${state.feedback.map(t=>`<div class="feedback-saved">${esc(t)}</div>`).join('')}</aside></section>`}
function experience(){const t=topics[state.topic];if(state.finish)return experienceFinish();const caption=state.answer?state.answer.text:!state.started?"Welcome. This is your space to look closer, ask questions and find what matters to you.":t.captions[state.line];return `<main class="experience"><header class="experience-head"><div class="experience-brand"><span class="brand-seal">${icon('play',16)}</span><strong>Tata Nexon</strong><small>A GUIDED PRODUCT EXPERIENCE</small></div><div class="head-links"><span class="caption-mode">${icon('mute',14)} Muted · captions</span><button class="text-link" data-action="back-studio">${icon('back',13)} Back to studio</button></div></header><div class="experience-main"><section class="experience-scene ${t.photo?'photo':''}" aria-label="Product view"><div class="scene-header"><span class="label">The Nexon story / 0${state.topic+1}</span><span class="tag plain">Design simulation</span></div><h1 class="scene-title">${t.title}</h1><img class="scene-picture" src="./assets/${t.image}" alt="${t.name} view of Tata Nexon"><div class="scene-detail">${t.detail.map(([a,b])=>`<div><strong>${a}</strong><span>${b}</span></div>`).join('')}</div></section><aside class="guide-panel"><div class="guide-top"><span class="agent-stamp">${icon('agent',22)}</span><div><strong>${esc(state.voice)}, your guide</strong><small><span class="live-dot"></span>${state.answer?'Answering your question':state.started?'Explore at your pace':'Ready when you are'}</small></div></div><div class="guide-chapter">${state.answer?'A moment for your question':!state.started?'An invitation to explore':`0${state.topic+1} / ${t.name}`}</div><div class="guide-caption" aria-live="polite">${esc(caption)}</div><div class="guide-source">${state.answer?'Sample answer · no live lookup or verified product claim':!state.started?'This sample uses captions only. Nothing is recorded, spoken or sent outside this page.':'Illustrative narration · explore one moment at a time'}</div><button class="btn blue" data-action="${state.answer?'return-tour':'continue'}">${state.answer?'Back to the tour':!state.started?'Begin the tour':state.topic===3&&state.line===2?'See your recap':state.line===2?'Next chapter':'Continue'} ${icon('arrow',15)}</button><div class="guide-question"><label for="customer-question">You can ask a question at any point.</label><form class="ask-field" id="question-form"><input id="customer-question" autocomplete="off" placeholder="What would you like to know?" aria-label="Ask your sample product guide"><button type="submit" aria-label="Send your question">${icon('send',17)}</button></form><div class="question-examples"><button data-action="question" data-question="What should I check for city driving?">City driving?</button><button data-action="question" data-question="Will my family fit comfortably?">Space for family?</button><button data-action="question" data-question="How does it compare?">Compare?</button></div></div></aside></div><nav class="topic-nav" aria-label="Explore a topic">${topics.map((x,i)=>`<button class="${state.topic===i?'on':''}" data-action="topic" data-index="${i}"><span class="tnum">0${i+1}</span>${x.name}</button>`).join('')}</nav><footer class="experience-footer"><span>ATELIER / SAMPLE EXPERIENCE<br>Product imagery is illustrative. Specifications are not verified in this prototype.</span><button data-action="finish">Finish & reflect ${icon('arrow',12)}</button></footer></main>`}
function experienceFinish(){return `<main class="experience"><header class="experience-head"><div class="experience-brand"><span class="brand-seal">${icon('play',16)}</span><strong>Tata Nexon</strong></div><button class="text-link" data-action="back-studio">${icon('back',13)} Back to studio</button></header><section class="experience-finish"><div class="label blue">A moment to reflect</div><h1>Your next step.<br><em>Your choice.</em></h1><p>We explored ${state.visited.size?[...state.visited].map(i=>topics[i].name.toLowerCase()).join(', '):'a first look at the Nexon'}. ${state.questions.length?`You also asked ${state.questions.length} question${state.questions.length===1?'':'s'}.`:'You can come back with a question whenever you like.'} A real visit can help turn those first impressions into a personal decision.</p><div class="finish-topics">${[...state.visited].map(i=>`<span class="tag plain">${topics[i].name}</span>`).join('')||'<span class="tag plain">Your first look</span>'}</div><div class="finish-actions">${state.actions.drive?`<button class="btn primary" data-action="booking">Plan a test drive ${icon('arrow',15)}</button>`:''}<button class="btn light" data-action="resume">Keep exploring ${icon('back',14)}</button></div><div class="finish-note">Prototype only. No booking, lead or contact information is submitted.</div></section></main>`}
const sampleConversations=[{number:'01',name:'A practical shortlist',detail:'Family space · city use · sample session',kind:'followup'},{number:'02',name:'A closer look at the cabin',detail:'Comfort · controls · sample session',kind:'complete'},{number:'03',name:'The ownership questions',detail:'Service · variant choice · sample session',kind:'followup'}];
function insights(){return `<main class="page"><div class="page-kicker"><span class="label">The listening room / Insights</span><span class="date">Illustrative dashboard</span></div><div class="insights-top"><div><h1 class="page-title">Every conversation<br>leaves an <em>insight.</em></h1><p class="description">See what customers explored, what they asked and where a thoughtful follow-up could make the difference.</p></div><button class="btn light small" data-action="date-range">${icon('clock',13)} ${state.dateRange} ${icon('chevron',12)}</button></div><p class="sample-note">${icon('shield',13)} All numbers below are fictional design data. They are not app measurements or business results.</p><section class="insight-stats" aria-label="Illustrative metrics"><div class="insight-stat"><strong>${state.dateRange==='Last 7 days'?'128':'462'}</strong><span>Sample conversations</span><small>Illustrative volume</small></div><div class="insight-stat"><strong>${state.dateRange==='Last 7 days'?'4.2':'4.6'}<span style="font-size:24px">m</span></strong><span>Sample time exploring</span><small>Illustrative engagement</small></div><div class="insight-stat"><strong>${state.dateRange==='Last 7 days'?'36':'124'}</strong><span>Sample follow-up choices</span><small>Illustrative conversion</small></div></section><section class="insight-layout"><div class="insight-topics"><div class="section-title"><h2>What drew them in.</h2><span class="count">Sample topic mix</span></div>${[['Cabin & comfort',76],['Everyday practicality',61],['Ownership questions',44],['Design & details',32]].map(([n,v])=>`<div class="bar-row"><div><span>${n}</span><span>${v}%</span></div><div class="bar-track"><span style="width:${v}%"></span></div></div>`).join('')}<p class="insight-caption">“People aren’t just looking for features. They’re looking for a place for the product in their lives.”</p></div><div><div class="section-title"><h2>The conversations.</h2><span class="count">3 fictional examples</span></div><div class="conversation-filter"><button class="${state.insightFilter==='all'?'on':''}" data-action="filter" data-filter="all">All examples</button><button class="${state.insightFilter==='followup'?'on':''}" data-action="filter" data-filter="followup">Follow-up moments</button></div>${sampleConversations.filter(s=>state.insightFilter==='all'||s.kind==='followup').map(s=>`<div class="conversation-row"><span class="session-number">${s.number}</span><div><strong>${s.name}</strong><small>${s.detail}</small></div><button class="circle-btn" data-action="conversation" data-index="${s.number}" aria-label="Read ${s.name}">${icon('arrow',14)}</button></div>`).join('')}<div class="review-note">The original app’s transcript, summary and explicit customer choice remain the foundation. This direction changes only the presentation.</div></div></section>${footer()}</main>`}
function render(){app.innerHTML=state.page==='experience'?experience():header()+(state.page==='studio'?studio():state.page==='insights'?insights():home());wireDrop();}
function go(page,stage){state.page=page;if(stage)state.stage=stage;render();window.scrollTo({top:0,behavior:'instant'});}
function toast(text){clearTimeout(state.toastTimer);toastRoot.innerHTML=`<div class="toast" role="status">${icon('check',14)}<span>${esc(text)}</span></div>`;state.toastTimer=setTimeout(()=>toastRoot.innerHTML='',3800)}
let returnFocus=null;
function modal(title,body,actions='',wide=false){returnFocus=document.activeElement;modalRoot.innerHTML=`<div class="modal-layer"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><span class="label blue">Atelier / local prototype</span><button class="circle-btn" data-action="close-modal" aria-label="Close dialog">${icon('close',14)}</button></div><h2 id="modal-title">${title}</h2>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';modalRoot.querySelector('input,textarea,button')?.focus();}
function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();}
function addFiles(files){for(const f of files)state.sources.push({name:f.name,detail:'Local filename only · content not read',kind:/\.(png|jpe?g|webp|avif)$/i.test(f.name)?'image':'file',status:'Added locally'});render();toast(`${files.length} filename${files.length===1?'':'s'} added to the sample. No file was uploaded.`)}
function wireDrop(){const drop=document.getElementById('source-drop');if(!drop)return;drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files])});}
function ask(question){question=question.trim();if(!question){toast('Type a question, or choose one of the examples.');return;}if(!state.returnPoint)state.returnPoint={topic:state.topic,line:state.line,started:state.started};state.questions.push(question);let text="That’s a useful question. In the real demo, I’d answer from the approved sources or say what still needs checking. This prototype shows the conversation flow, without looking anything up.";if(/city|traffic|driv/i.test(question))text="For your city routine, I’d start with a personal test-drive checklist: seating, visibility, parking and how the controls feel. What part of city driving matters most to you?";else if(/family|space|boot|seat|comfort/i.test(question))text="Let’s make that a real fit check. Think about who usually travels with you, your child seat if you use one, and the bags you carry. Trying those in person is the most useful next step.";else if(/compar|brezza|venue|compet/i.test(question))text="We can compare the exact variants using reviewed official information in the real demo. This design prototype has no live lookup, so I won’t invent a comparison. Shall we return to the tour?";else if(/price|cost|emi|warranty/i.test(question))text="I’d want the applicable variant, current quote and full terms before answering that. This prototype has no verified pricing or policy source. A real guide would keep the question open for follow-up.";state.answer={question,text};render();}
const actions={
  nav(el){go(el.dataset.page)},'open-studio'(){go('studio','sources')},stage(el){const s=el.dataset.stage;if(s==='rehearse'&&!state.built){toast('Approve all six checkpoints, then build the local preview.');go('studio','align');return;}go('studio',s)},
  experience(){state.page='experience';state.finish=false;render();window.scrollTo({top:0,behavior:'instant'})},'back-studio'(){go('studio',state.built?'rehearse':'align')},
  'new-demo'(){modal('Begin a new story.','<p>Create a sample brief. It stays in memory on this page and disappears when you refresh.</p><label for="new-name">Product or experience name</label><input id="new-name" placeholder="Your next product" maxlength="70">','<button class="btn light" data-action="close-modal">Cancel</button><button class="btn primary" data-action="create-demo">Create sample '+icon('arrow',14)+'</button>');document.getElementById('new-name').focus()},
  'create-demo'(){const v=document.getElementById('new-name').value.trim();if(!v){document.getElementById('new-name').focus();toast('Give the sample a name first.');return;}state.projects.push(v);closeModal();go('home');toast('Local sample added to your collection. No app demo was created.')},
  collection(el){const n=el.dataset.product,img=n==='TVS iQube'?'iqube.jpg':'audi.jpg';modal(`${esc(n)}, considered.`,`<p>A second editorial treatment in the sample collection. The complete clickable flow in this direction uses the Nexon.</p><img class="modal-preview" src="./assets/${img}" alt="${esc(n)} sample product image"><p class="modal-caption">Product image for visual exploration. No demo is created or edited.</p>`,'<button class="btn light" data-action="close-modal">Close</button><button class="btn primary" data-action="open-nexon">Explore Nexon '+icon('arrow',14)+'</button>',true)},
  'sample-project'(el){modal(esc(el.dataset.product),'<p>This local brief is ready for your ideas. The working demonstration in this design study remains the Nexon flow.</p>','<button class="btn light" data-action="close-modal">Keep browsing</button><button class="btn primary" data-action="open-nexon">Open sample flow '+icon('arrow',14)+'</button>')},'open-nexon'(){closeModal();go('studio','sources')},
  files(){document.getElementById('file-picker').click()},'remove-source'(el){state.sources.splice(Number(el.dataset.index),1);render();toast('Removed from the local sample library.')},
  'add-url'(){modal('A page with perspective.','<p>Enter a reference label or URL. It is added to the local mock only; this page never fetches its contents.</p><label for="source-url">Sample page or URL</label><input id="source-url" placeholder="https://example.com/product">','<button class="btn light" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-url">Add local reference '+icon('plus',14)+'</button>')},
  'save-url'(){const v=document.getElementById('source-url').value.trim();if(!v){toast('Enter a reference first.');return;}state.sources.push({name:v,detail:'Local reference only · page not fetched',kind:'link',status:'Added locally'});closeModal();render();toast('Reference added. No page was fetched.')},
  'brand-notes'(){modal('A voice that feels like you.','<p>Leave a few sample notes about tone and vocabulary. They stay in this page only.</p><label for="brand-text">Local brand notes</label><textarea id="brand-text" placeholder="Warm, precise and unhurried. Ask one good question at a time."></textarea>','<button class="btn light" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-brand">Add notes '+icon('plus',14)+'</button>')},
  'save-brand'(){const v=document.getElementById('brand-text').value.trim();if(!v){toast('Write a short note first.');return;}state.sources.push({name:'Your local brand direction',detail:v.slice(0,85),kind:'file',status:'Added locally'});closeModal();render();toast('Brand notes added to the sample.')},
  setting(el){const k=el.dataset.setting,opts=k==='language'?['English','Hindi','Hinglish']:k==='voice'?['Asha','Arjun','Maya']:['Everyday buyer','Informed buyer','Expert'];modal(k==='voice'?'Choose a guide.':k==='language'?'Choose a language.':'Set the level of detail.',`<p>This local preference changes the displayed selection only. Sample narration remains in English and captions remain muted.</p><div class="local-options">${opts.map(o=>`<button class="${state[k]===o?'selected':''}" data-action="choose-setting" data-setting="${k}" data-value="${o}">${o}</button>`).join('')}</div>`,'<button class="btn light" data-action="close-modal">Done</button>')},
  'choose-setting'(el){state[el.dataset.setting]=el.dataset.value;closeModal();render();toast('Sample preference updated locally.')},
  read(){if(!state.sources.length)return;const token=++state.buildToken;modal('Preparing a point of view.','<p>A short local animation stands in for the app’s source reading. Nothing is sent to a provider.</p><div class="progress-preview"><span></span></div><div class="progress-label">Arranging the sample review checkpoints…</div>');setTimeout(()=>{if(token!==state.buildToken)return;state.read=true;closeModal();go('studio','align');toast('Your six sample checkpoints are ready for review.')},1200)},
  review(el){state.review=el.dataset.card;render()},approve(){if(state.approved.has(state.review)){state.approved.delete(state.review);state.built=false;render();toast('Checkpoint reopened in the local sample.');return;}state.approved.add(state.review);const next=cards.find(c=>!state.approved.has(c[0]));if(next)state.review=next[0];render();toast(state.approved.size===6?'All six checkpoints approved. The local preview is ready to build.':'Checkpoint approved locally. The next review is open.')},
  image(el){modal(esc(el.dataset.title),`<img class="modal-preview" src="./assets/${el.dataset.image}" alt="${esc(el.dataset.title)}"><p class="modal-caption">Illustrative imagery. The real app keeps visual evidence aligned to the approved narration.</p>`,'<button class="btn primary" data-action="close-modal">Back to the review '+icon('back',14)+'</button>',true)},
  'edit-script'(){modal('Find the right words.',`<p>Edit this sample introduction locally. Saving reopens the Script checkpoint in this prototype.</p><label for="script-text">Sample introduction</label><textarea id="script-text">${esc(state.script)}</textarea>`,'<button class="btn light" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-script">Save local copy '+icon('check',14)+'</button>')},
  'save-script'(){const t=document.getElementById('script-text').value.trim();if(!t){toast('Keep at least one line in the sample introduction.');return;}state.script=t;state.approved.delete('script');state.built=false;closeModal();render();toast('Sample copy saved. Script approval reopened locally.')},faq(el){state.faqOpen=state.faqOpen===Number(el.dataset.index)?-1:Number(el.dataset.index);render()},
  'voice-preview'(){modal('The sound of the words.',`<p>Caption preview only — no sound will play.</p><div class="caption-preview">“Hello, I’m ${esc(state.voice)}. Take a moment. Tell me what you need, and we’ll explore that together.”</div>`,'<button class="btn primary" data-action="close-modal">Back to the review '+icon('back',14)+'</button>')},
  build(){if(state.approved.size!==6){toast('Approve all six checkpoints first.');return;}const token=++state.buildToken;modal('Your preview is taking shape.','<p>This is a local design animation. No voice is recorded and no real build is started.</p><div class="progress-preview"><span></span></div><div class="progress-label">Arranging the sample experience…</div>');setTimeout(()=>{if(token!==state.buildToken)return;state.built=true;closeModal();go('studio','rehearse');toast('Local preview ready. Explore it with captions.')},1000)},
  feedback(){const input=document.getElementById('feedback-text'),t=input.value.trim();if(!t){input.focus();toast('Add a note before saving.');return;}state.feedback.push(t);render();toast('Local note saved. No real feedback or rebuild was submitted.')},
  continue(){state.visited.add(state.topic);if(!state.started){state.started=true;state.line=0;}else if(state.line<topics[state.topic].captions.length-1)state.line++;else if(state.topic<topics.length-1){state.topic++;state.line=0;state.visited.add(state.topic);}else state.finish=true;render()},topic(el){state.topic=Number(el.dataset.index);state.line=0;state.started=true;state.answer=null;state.returnPoint=null;state.visited.add(state.topic);render()},question(el){ask(el.dataset.question)},
  'return-tour'(){if(state.returnPoint){state.topic=state.returnPoint.topic;state.line=state.returnPoint.line;state.started=state.returnPoint.started;}state.answer=null;state.returnPoint=null;render()},finish(){state.finish=true;render();window.scrollTo({top:0,behavior:'instant'})},resume(){state.finish=false;render();window.scrollTo({top:0,behavior:'instant'})},
  booking(){modal('A thoughtful next step.','<p>Preview how a test-drive preference could feel. Do not enter personal details; no appointment will be booked.</p><div class="local-options" id="booking-options"><button class="selected" data-action="booking-choice">A weekday</button><button data-action="booking-choice">The weekend</button><button data-action="booking-choice">Decide later</button></div>','<button class="btn light" data-action="close-modal">Not now</button><button class="btn primary" data-action="confirm-booking">Confirm sample choice '+icon('check',14)+'</button>')},
  'booking-choice'(el){document.querySelectorAll('#booking-options button').forEach(b=>b.classList.toggle('selected',b===el))},'confirm-booking'(){const choice=document.querySelector('#booking-options .selected')?.textContent||'A later date';closeModal();toast(`${choice} selected in the prototype. No booking was made.`)},
  'date-range'(){state.dateRange=state.dateRange==='Last 7 days'?'Last 30 days':'Last 7 days';render();toast('Changed the fictional sample range.')},filter(el){state.insightFilter=el.dataset.filter;render()},conversation(el){const s=sampleConversations.find(x=>x.number===el.dataset.index);modal(esc(s.name),`<p>Fictional conversation excerpt for design review.</p><div class="transcript-item customer"><b>Customer</b>I’m looking for something that works for the family and my everyday commute.</div><div class="transcript-item"><b>Guide</b>Let’s start with the cabin and the things you carry most days. What would you like to try first?</div><div class="transcript-item customer"><b>Customer</b>I’d like to see the seating and make a short test-drive checklist.</div><div class="review-note">Sample outcome: the customer chose to keep exploring. No real customer or session is represented.</div>`,'<button class="btn primary" data-action="close-modal">Back to insights '+icon('back',14)+'</button>')},
  'close-modal'(){state.buildToken++;closeModal()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){actions[el.dataset.action]?.(el);return;}if(e.target.classList.contains('modal-layer')){state.buildToken++;closeModal()}});
document.addEventListener('submit',e=>{if(e.target.id==='question-form'){e.preventDefault();ask(document.getElementById('customer-question').value)}});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){state.actions[e.target.dataset.toggle]=e.target.checked;state.approved.delete('actions');state.built=false;toast('Local action choice updated. Review approval reopened.');render();}});
document.getElementById('file-picker').addEventListener('change',e=>{if(e.target.files.length)addFiles([...e.target.files]);e.target.value=''});
document.addEventListener('keydown',e=>{if(!modalRoot.firstChild)return;if(e.key==='Escape'){state.buildToken++;closeModal();return;}if(e.key==='Tab'){const focus=[...modalRoot.querySelectorAll('button:not(:disabled),input,textarea,a[href]')];if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</body>
</html>
