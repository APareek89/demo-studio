<main>
  <h1>Player browser contract</h1>
  <p>Real player UI. Synthetic bundle, speech events, audio and API replies. No paid calls or external connections. Virtual time preserves timer order and flushes promise continuations.</p>
  <button id="run" disabled>Loading player…</button>
  <div id="summary" role="status" aria-live="polite">Loading</div>
  <ol id="results"></ol>
  <details><summary>Evidence and test boundaries</summary><pre id="evidence"></pre></details>
  <div id="fixture" aria-label="Real player under test"></div>
</main>
<script type="module">
const host = document.querySelector('#fixture');
const results = document.querySelector('#results');
const summary = document.querySelector('#summary');
const evidence = document.querySelector('#evidence');
const runButton = document.querySelector('#run');
const native = { timeout: window.setTimeout, interval: window.setInterval, clearTimeout: window.clearTimeout, clearInterval: window.clearInterval, now: Date.now };
let env, player, clock;
const flush = async () => { for (let i = 0; i < 100; i++) await Promise.resolve(); };
const assert = (ok, message) => { if (!ok) throw new Error(message); };
const snapshot = (x) => JSON.parse(JSON.stringify(x));
const audioURL = (text) => 'fake-audio:' + encodeURIComponent(text);

class Clock {
  constructor() { this.now = 1800000000000; this.next = 1; this.jobs = new Map(); }
  add(fn, delay, repeat, args) { const id = this.next++; this.jobs.set(id, { fn, at: this.now + Math.max(0, Number(delay) || 0), repeat, args }); return id; }
  install() {
    window.setTimeout = (fn, ms, ...args) => this.add(fn, ms, 0, args);
    window.setInterval = (fn, ms, ...args) => this.add(fn, ms, Math.max(1, Number(ms) || 1), args);
    window.clearTimeout = window.clearInterval = (id) => this.jobs.delete(id);
    Date.now = () => this.now;
  }
  async tick(ms) {
    const end = this.now + ms; let budget = 20000;
    await flush();
    while (budget--) {
      const next = [...this.jobs].filter(([, j]) => j.at <= end).sort((a, b) => a[1].at - b[1].at || a[0] - b[0])[0];
      if (!next) break;
      const [id, j] = next; this.now = j.at;
      if (j.repeat) j.at += j.repeat; else this.jobs.delete(id);
      j.fn(...j.args); await flush();
    }
    assert(budget > 0, 'Virtual timer budget exhausted');
    this.now = end; await flush();
  }
}

class FakeAudio {
  constructor(url) { this.src = url; this.currentTime = 0; this.duration = 10; this.paused = true; this.owner = env; }
  load() {}
  removeAttribute() {}
  play() {
    this.paused = false;
    const e = this.owner, text = decodeURIComponent(this.src.replace('fake-audio:', ''));
    e.active.add(this); e.maxActive = Math.max(e.maxActive, e.active.size); e.played.push(text); this.text = text;
    this.onplaying?.();
    if (!e.hold(text)) queueMicrotask(() => this.finish());
    return Promise.resolve();
  }
  pause() { this.paused = true; this.owner.active.delete(this); }
  finish() { if (this.paused) return; this.currentTime = this.duration; this.paused = true; this.owner.active.delete(this); this.onended?.(); }
}

// abort intentionally permits an already queued recognition result to arrive.
// A real player must fence it by the listening attempt/run, not trust cancellation.
class FakeRecognition {
  constructor() { this.owner = env; this.owner.recognizers.push(this); this.started = false; }
  start() { this.started = true; }
  stop() { this.onend?.(); }
  abort() { this.aborted = true; }
  speechStart() { this.onspeechstart?.(); }
  partial(text) { const result = [{ transcript: text }]; result.isFinal = false; this.onresult?.({ results: [result] }); }
  deliver(text) { const result = [{ transcript: text }]; result.isFinal = true; this.onresult?.({ results: [result] }); this.onend?.(); }
}
window.Audio = FakeAudio;
window.SpeechRecognition = FakeRecognition;
window.webkitSpeechRecognition = FakeRecognition;
window.fetch = () => Promise.reject(new Error('Network is disabled in this harness'));
const { mountPlayer } = await import('/web/player/player.js');
const { renderSlide } = await import('/web/slide.js');

const line = (id, text) => ({ id, text, fact_ids: ['f1'], audio: audioURL(text) });
function slide(id, kind, text, checkin = '') {
  return { id, segment_id: id, kind, title: id, topics: [id], image_url: null, image_parts: [], callouts: [], motion: 'none', lines: text ? [line(id + '-l1', text)] : [], checkin: { text: checkin, audio: checkin ? audioURL(checkin) : null }, deeper: [], priority: false, usp_ids: [], role: kind };
}
function bundle(opening = false) {
  const slides = [slide('hero', 'hero_open', '')];
  if (opening) { const s = slide('opening', 'intro', 'Opening first complete.'); s.lines.push(line('opening-l2', 'Opening second detail.')); slides.push(s); }
  slides.push(slide('proof-one', 'proof', 'First proof.', 'Any questions about the first proof?'), slide('proof-two', 'proof', 'Second proof.', 'Any questions about the second proof?'), slide('proof-three', 'proof', 'Third proof.', 'Any questions about the third proof?'), slide('hero-end', 'hero_close', ''));
  return { name: 'Synthetic browser contract', language: 'en-IN', product: { name: 'Fixture car' }, voice: { provider: 'sarvam', persona: { persona_name: 'Test guide' } }, intake: { q1: 'What matters to you?', audio: { q1: audioURL('What matters to you?') } }, media: {}, slides, facts: [{ id: 'f1', claim: 'Fixture fact', value: 'Evidence' }], ctas: [], fillers: {} };
}
const answered = (extra = {}) => ({ answered: true, answer: 'The approved source answers this.', fact_ids: ['f1'], topic: 'safety', route: 'stay', from_bank: true, ...extra });
async function setup({ opening = false, hold = () => false, holdProof = true, voiceMode = true, qa = async () => answered(), pitch = async () => null, lead = async () => ({}), configure = (b) => b } = {}) {
  player?.destroy(); await flush();
  // Keep the real player inside the viewport as this page's result list grows.
  // Its production sizing correctly collapses a host wholly below the viewport.
  host.scrollIntoView({ block: 'start' });
  env = { calls: [], saved: [], beacons: [], ttsCalls: [], leadCalls: [], played: [], active: new Set(), maxActive: 0, recognizers: [], hold: text => hold(text) || (holdProof && ['First proof.', 'Second proof.', 'Third proof.'].includes(text)) };
  clock = new Clock(); clock.install();
  const owner = env;
  player = mountPlayer(host, configure(bundle(opening)), {
    qa: async (request) => { owner.calls.push(snapshot(request)); return qa(request, owner.calls.length); },
    tts: async (text) => { owner.ttsCalls.push(text); return audioURL(text); },
    pitch,
    lead: async (request) => { owner.leadCalls.push(snapshot(request)); return lead(request, owner.leadCalls.length); },
    saveSession: async (record) => { owner.saved.push(snapshot(record)); },
    beacon: (record) => { owner.beacons.push(snapshot(record)); },
  });
  // Older interaction fixtures explicitly choose voice. Default-mode checks
  // pass null so they inspect the actual welcome selection unchanged.
  if (voiceMode !== null) host.querySelector('input[role="switch"]').checked = voiceMode;
  await flush();
}
function button(text, selector = 'button') {
  const labels = { 'Skip the intro': ['Skip the intro', 'Browse at my pace'], '▶ Start': ['▶ Start', 'Explore with me'] }[text] || [text];
  return [...host.querySelectorAll(selector)].find((b) => labels.includes(b.textContent.trim()));
}
async function click(text, selector) { const b = button(text, selector); assert(b, 'Missing button: ' + text); b.click(); await flush(); }
async function type(text) { const input = host.querySelector('.composer input'); input.value = text; input.form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); input.blur(); await flush(); }
async function atProof() { await click('Skip the intro'); assert(player.context().slide === 'proof-one', 'Fixture did not reach first proof'); assert([...env.active].some(audio => audio.text === 'First proof.'), 'Fixture did not hold first proof narration'); }
async function finishAudio(text) { const audio = [...env.active].find(item => item.text === text); assert(audio, 'Missing held audio: ' + text); audio.finish(); await flush(); }
async function finishTour() { for (const text of ['First proof.', 'Second proof.', 'Third proof.']) await finishAudio(text); }
const recentRecognizer = () => env.recognizers.at(-1);
const detail = () => ({ context: player?.context(), currentCitations: host.querySelector('.pl-cap .cite')?.textContent, qa: env?.calls, audioStarted: env?.played, ttsRequests: env?.ttsCalls, maximumSimultaneousAudio: env?.maxActive, activeAudio: env?.active.size, geometry: env?.geometry, savedSessions: env?.saved, beaconSessions: env?.beacons, leadRequests: env?.leadCalls });
const cases = [];
const test = (name, fn) => cases.push({ name, fn });

test('Runtime section invitations wait exactly three seconds without requiring a reply', async () => {
  await setup({ voiceMode:false, configure:b=>({...b,runtime:{version:1}}) }); await atProof();
  await finishAudio('First proof.');
  const invitation = "Anything you'd like to know about what we've just covered?";
  assert(env.played.includes(invitation) && player.context().slide === 'proof-one', 'Section ended without its invitation');
  await clock.tick(2999); assert(!env.played.includes('Second proof.'), 'Section advanced before three seconds');
  await clock.tick(1); assert(env.played.at(-1) === 'Second proof.' && env.calls.length === 0 && env.maxActive === 1, 'Section did not resume once without inventing a reply');
});
test('A generic tour request stays neutral and never invents personalization', async () => {
  let pitches = 0;
  await setup({voiceMode:false,pitch:async()=>{pitches++;return null;}}); await click('▶ Start'); await type('Show me around.');
  assert(env.played.includes('Let me take you through the demo.') && !env.played.some(t=>t.includes('Thanks, that helps me focus')), 'Generic request received a false preference acknowledgement');
  assert(pitches === 0 && !player.context().profile.why && player.context().profile.stated_needs.length === 0 && player.context().slide === 'proof-one', 'Generic request personalized the demo or failed to begin');
});
test('False onset and a recognition fragment cannot freeze the three-second answer window', async () => {
  await setup({voiceMode:false}); await atProof(); host.querySelector('.pl-reply .mic').click(); await flush();
  recentRecognizer().deliver('What is supported?'); await flush();
  const rec=recentRecognizer(); await clock.tick(1200); rec.speechStart(); rec.partial('What is'); rec.deliver("It's"); await flush();
  await clock.tick(1800);
  assert(env.calls.length===1 && env.played.filter(t=>t==='First proof.').length===2, 'Noise or fragment took ownership or prevented automatic continuation');
});
test('Partial intake stays provisional and a final fragment never becomes a preference', async () => {
  await setup(); await click('▶ Start'); const rec=recentRecognizer();
  rec.partial('I need more room'); await flush();
  assert(host.querySelector('.pl-intake.open') && !player.context().profile.why, 'Partial recognition personalized the visit');
  rec.deliver("It's"); await flush();
  assert(host.querySelector('.pl-intake.open') && !player.context().profile.why && env.calls.length===0, 'Recognition fragment became intake');
});
test('Active visits save incrementally and pagehide retains started speech without ending the visit', async () => {
  await setup({voiceMode:false}); await atProof(); await clock.tick(15000);
  assert(env.saved.some(s=>!s.ended && s.slides_visited.some(v=>v.slide_id==='proof-one')), 'Ongoing visit was not persisted before Stop');
  [...env.active][0].currentTime = 5;
  window.dispatchEvent(new Event('pagehide')); const saved=env.beacons.at(-1);
  assert(!saved.ended && saved.transcript.some(t=>t.role==='agent' && t.text==='First' && t.full==='First proof.' && t.interrupted), 'Pagehide lost the heard prefix or falsely claimed complete narration');
  assert(env.saved.every((s,i,a)=>i===0 || s.save_seq>a[i-1].save_seq), 'Incremental save sequence is not monotonic');
});
test('Typed Continue stays in playback control and does not ask the answer graph', async () => {
  await setup({voiceMode:false}); await atProof(); await type('What is supported?'); const count=env.calls.length;
  await type('Continue');
  assert(env.calls.length===count && env.played.filter(t=>t==='First proof.').length===2 && !env.played.includes('This is a good question, give me a moment.'), 'Continue became a question or failed to resume');
});

test('A minimum-duration bundle uses its recorded overview without live transport and resumes it after Q&A', async () => {
  const overview = 'This is the published recorded overview counted in the narration minimum.';
  await setup({ opening: true, voiceMode: false, hold: text => text === overview, configure: b => ({...b,
    runtime: {version:1,narration_minimum:{minimum_seconds:180,seconds:185,measured:true,sufficient:true},overview:{text:overview,audio:audioURL(overview),slide_id:'opening',fact_ids:['f1']}}
  }) });
  await click('▶ Start'); await type('I need a family car.');
  assert(env.played.at(-1) === overview && !env.played.includes('Opening first complete.'), 'No-transport mode replaced the counted overview with shorter legacy speech');
  assert(!env.ttsCalls.includes(overview), 'Recorded overview requested new speech generation');
  await type('What is the warranty?');
  assert(env.calls[0].cursor.phase === 'overview', 'Question lost its overview checkpoint');
  await click('Continue demo', '.pl-chips button');
  assert(env.played.at(-1) === overview && env.played.filter(text=>text===overview).length===2, 'Answer did not return to the interrupted recorded overview exactly once');
  await finishAudio(overview);
  assert(player.context().slide === 'proof-one' && !env.played.includes('Opening first complete.') && !env.ttsCalls.includes(overview), 'Overview completion did not reach the route without legacy replay or new voice generation');
  assert(env.maxActive===1, 'Overview return overlapped audio');
});
test('A legacy bundle without the narration minimum keeps its existing no-transport opening', async () => {
  const overview = 'Legacy runtime overview.';
  await setup({ opening:true, voiceMode:false, hold:text=>text==='Opening first complete.', configure:b=>({...b,
    runtime:{version:1,overview:{text:overview,audio:audioURL(overview),slide_id:'opening',fact_ids:['f1']}}
  }) });
  await click('▶ Start'); await type('Family driving.');
  assert(env.played.at(-1)==='Opening first complete.'&&!env.played.includes(overview),'Legacy no-transport opening changed');
});

test('Default minimum tour keeps complete Q&A-covered stops and both reviewed closing lines', async () => {
  const overview='Recorded overview for this minimum tour.', detail='Second reviewed proof detail counted in the tour.', closingOne='The first complete reviewed closing line.', closingTwo='The second complete reviewed closing line.', advance='A shorter generated closing.';
  await setup({opening:true,voiceMode:false,hold:text=>[overview,detail,closingOne,closingTwo].includes(text),
    qa:async()=>answered({route:'jump',slide_id:'proof-two'}),
    pitch:async()=>({route:['proof-one','proof-two','proof-three'].map(slide_id=>({slide_id})),advance,advance_audio:audioURL(advance),narration_minimum:{minimum_seconds:180,sufficient:true}}),
    configure:b=>{b.runtime={version:1,narration_minimum:{minimum_seconds:180,seconds:185,measured:true},overview:{text:overview,audio:audioURL(overview),slide_id:'opening',fact_ids:['f1']}};b.slides.find(s=>s.id==='proof-two').lines.push(line('proof-two-detail',detail));const closing=slide('closing','closing',closingOne);closing.lines.push(line('closing-two',closingTwo));b.slides.splice(-1,0,closing);return b;}
  });
  await click('▶ Start');await type('Family driving.');await type('Show the second proof.');await click('Continue demo','.pl-chips button');await finishAudio(overview);
  await finishAudio('First proof.');await clock.tick(3000);await finishAudio('Second proof.');
  assert(env.played.at(-1)===detail,'Previously visited slide lost counted main narration');
  await finishAudio(detail);await clock.tick(3000);await finishAudio('Third proof.');await clock.tick(3000);
  assert(env.played.at(-1)===closingOne&&!env.played.includes(advance),'Generated advance replaced counted closing narration');
  await finishAudio(closingOne);assert(env.played.at(-1)===closingTwo,'Second reviewed closing line was skipped');await finishAudio(closingTwo);
  assert(button('Not yet','.pl-chips button')&&env.maxActive===1,'Complete tour lost its explicit end choice or overlapped audio');
});

test('Optional intake websites reach planning and remain available across later questions', async () => {
  const pitches = [];
  await setup({ voiceMode: false, pitch: async request => { pitches.push(snapshot(request)); return null; } });
  await click('▶ Start');
  const sites = host.querySelector('input[aria-label="Websites I can check (optional)"]');
  assert(sites && sites.placeholder === 'hyundai.com/in/en/find-a-car/creta', 'Optional website field or its bare-domain example is missing');
  sites.value = 'hyundai.com/in/en/find-a-car/creta, https://example.com/warranty';
  const input = host.querySelector('.pl-intake .fallback input[aria-label="Your answer"]');
  input.value = 'I need space for luggage.'; input.form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); await flush();
  const expected = ['https://hyundai.com/in/en/find-a-car/creta', 'https://example.com/warranty'];
  assert(JSON.stringify(pitches.at(-1)?.profile.customer_urls) === JSON.stringify(expected), 'Intake sites did not reach planning');
  for (const question of ['What is the warranty?', 'How much luggage fits?', 'What is the ground clearance?']) await type(question);
  assert(env.calls.length === 3 && env.calls.every(call => JSON.stringify(call.profile.customer_urls) === JSON.stringify(expected)), 'Intake sites were lost on a later question');
  assert(env.played.filter(text => text === 'What matters to you?').length === 1, 'Optional sites added a spoken intake question');
});
test('Intake sites cap at five and later typed and spoken URLs append without duplicates', async () => {
  await setup({ voiceMode: false }); await click('▶ Start');
  host.querySelector('input[aria-label="Websites I can check (optional)"]').value = 'one.example.com, two.example.com, three.example.com, four.example.com, five.example.com, six.example.com';
  await click('Skip, start the demo');
  assert(player.context().profile.customer_urls.length === 5, 'Skipping intake did not retain its five-site limit');
  await type('Check one.example.com and six.example.com for warranty.');
  assert(env.calls.at(-1).profile.customer_urls.length === 6, 'Typed sites were duplicated or not appended');
  host.querySelector('.pl-reply .mic').click(); await flush();
  recentRecognizer().deliver('Check seven.example.com and eight.example.com and nine.example.com for service.'); await flush();
  const urls = env.calls.at(-1).profile.customer_urls;
  assert(urls.length === 8 && urls.includes('https://seven.example.com') && urls.includes('https://eight.example.com') && !urls.includes('https://nine.example.com'), 'Spoken sites did not obey the session limit');
});
test('Restart clears supplied sites and an email address never becomes lookup permission', async () => {
  await setup({ voiceMode: false }); await atProof();
  await type('My email is buyer@example.co.in; check hyundai.com/in/en/find-a-car/creta for warranty.');
  assert(JSON.stringify(env.calls.at(-1).profile.customer_urls) === JSON.stringify(['https://hyundai.com/in/en/find-a-car/creta']), 'An email was treated as website permission');
  host.querySelector('button[title="Restart"]').click(); await flush();
  assert(player.context().profile.customer_urls.length === 0 && host.querySelector('input[aria-label="Websites I can check (optional)"]').value === '', 'A new session inherited old website permission');
});
test('Websites submitted during the intake prompt continue without inventing a customer answer', async () => {
  await setup({ voiceMode: false, hold: text => text === 'What matters to you?' });
  await click('▶ Start');
  const sites = host.querySelector('input[aria-label="Websites I can check (optional)"]');
  sites.value = 'hyundai.com/in/en/find-a-car/creta';
  sites.form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); await flush();
  await finishAudio('What matters to you?');
  assert(!host.querySelector('.pl-intake:not(.pl-welcome)').classList.contains('open'), 'An early websites-only submission hung the intake');
  assert(player.context().profile.why === '' && player.context().profile.customer_urls.length === 1, 'Websites became a fabricated customer preference');
  window.dispatchEvent(new Event('pagehide'));
  assert(!env.beacons.at(-1).transcript.some(row => row.role === 'user'), 'An empty answer was fabricated in the transcript');
});

test('Voice mode welcome defaults follow continuous voice and muted automation', async () => {
  await setup({ voiceMode: null });
  assert(!host.querySelector('input[role="switch"]').checked, 'Legacy welcome unexpectedly requests voice');
  assert(host.querySelector('.pl-voice-choice').textContent.includes('Talk to Test guide. You can also type at any time.'), 'Welcome omits its input choice explanation');
  await setup({ voiceMode: null, configure: b => ({ ...b, runtime: { version: 1, continuous_voice: true } }) });
  assert(host.querySelector('input[role="switch"]').checked, 'Continuous voice did not default on');
  const original = location.href;
  try {
    const muted = new URL(original); muted.searchParams.set('mute', '1'); history.replaceState(null, '', muted);
    await setup({ voiceMode: null, configure: b => ({ ...b, runtime: { version: 1, continuous_voice: true } }) });
    assert(!host.querySelector('input[role="switch"]').checked, 'Muted automation enabled the microphone');
  } finally { history.replaceState(null, '', original); }
});
test('Text mode starts and accepts intake and questions without a microphone prompt', async () => {

});
test('Voice-mode visits still accept typed input and save the selected mode separately', async () => {
  await setup({ voiceMode: true }); await atProof(); await type('What is the warranty?');
  assert(env.calls.at(-1).input_mode === 'voice', 'Typing changed the chosen visit mode');
  window.dispatchEvent(new Event('pagehide'));

test('The player microphone button toggles mode during a text visit', async () => {
  await setup({ voiceMode: false }); await atProof();
  let mic = host.querySelector('.pl-reply .mic');
  assert(mic.getAttribute('aria-pressed') === 'false', 'Text mode microphone button appears on');
  mic.click(); await flush();
  assert(mic.getAttribute('aria-pressed') === 'true' && recentRecognizer()?.started, 'Explicit microphone click did not enable voice');
  mic.click(); await flush();
  assert(mic.getAttribute('aria-pressed') === 'false' && recentRecognizer().aborted, 'Explicit microphone off did not stop capture');
  await type('What is the warranty?'); window.dispatchEvent(new Event('pagehide'));
  assert(env.beacons.at(-1).input_mode === 'text', 'Session did not save the toggled mode');
});
test('The visible conversation voice switch and microphone share real capture ownership', async () => {
  await setup({ voiceMode: false }); await atProof();
  const toggle = host.querySelector('.pl-voice-toggle'), mic = host.querySelector('.pl-reply .mic');
  assert(toggle?.getBoundingClientRect().width > 0 && toggle.getAttribute('role') === 'switch' && toggle.getAttribute('aria-checked') === 'false', 'The visible conversation switch is missing or falsely enabled');
  toggle.click(); await flush();
  const first = recentRecognizer();
  assert(first?.started && toggle.getAttribute('aria-checked') === 'true' && mic.getAttribute('aria-pressed') === 'true', 'Conversation switch changed appearance without starting capture');
  mic.click(); await flush();
  assert(first.aborted && toggle.getAttribute('aria-checked') === 'false' && mic.getAttribute('aria-pressed') === 'false', 'Microphone off did not stop the switch-owned capture');
  mic.click(); await flush();
  const second = recentRecognizer();

  for (const width of [1000, 390]) {
    const { frame, view } = await renderFixture(width);
    try {
      view.setRevealed(0); view.layout();
      const stage = rect(view.el), picture = rect(view.pic), image = rect(view.img), nativeRatio = view.img.naturalWidth / view.img.naturalHeight;
      measurements.push({ requestedWidth: width, stage, picture, image, nativeRatio }); env.geometry = measurements;
      assert(image.width > 0 && image.height > 0, 'Image has no visible area');
      assert(Math.abs(image.width / image.height - nativeRatio) < .015, 'Image is distorted from its native aspect ratio');
      assert(Math.abs(picture.width / picture.height - nativeRatio) < .015, 'Annotation picture box differs from the native image ratio');
      assert(picture.x >= stage.x - 1 && picture.y >= stage.y - 1 && picture.right <= stage.right + 1 && picture.bottom <= stage.bottom + 1, 'Picture escapes its slide region');
      assert(frame.scrollWidth <= frame.clientWidth + 1, 'Slide content causes horizontal overflow inside the fixture');
      assert(document.documentElement.scrollWidth <= innerWidth + 1, 'Slide causes horizontal page overflow');
    } finally { view.destroy(); frame.remove(); }
  }
});

    }
    return true;
  };
  try {
    for (const width of [1000, 390, 304, 1000]) {
      frame.style.width = width + 'px'; view.setRevealed(0); view.layout();
      const leader = view.pic.querySelector('.leaders line'), chip = view.pic.querySelector('.callout'), dot = view.pic.querySelector('.dot');
      const item = view.el.querySelector('.slide-panel .item'), labelVisible = painted(chip), leaderVisible = painted(leader), fallbackVisible = painted(item);
      env.geometry.push({ width: frame.clientWidth, leaderVisibility: getComputedStyle(leader).visibility, chip: rect(chip), dot: rect(dot), evidence: rect(item) });

      assert(painted(dot) && Math.abs(d.x + d.width / 2 - image.x - image.width * anchor.x) <= 1.5 && Math.abs(d.y + d.height / 2 - image.y - image.height * anchor.y) <= 1.5, 'Responsive fallback moved or hid the trusted image anchor');

test('Crowded overlay labels settle in one pass without colliding with their fallback evidence', async () => {
  const callouts = Array.from({ length: 4 }, (_, i) => ({
    id: 'crowded-' + i, text: `Detail ${i + 1}: supported fixture information with a longer approved explanation that needs several readable lines.`,
    fact_ids: ['f' + (i + 1)], placement: 'overlay', anchor: { x: .5 + i * .1, y: .5 }, label_pos: { x: .68, y: .14 }, reveal_on_line: 0,
  }));
  const saved = snapshot(callouts), { frame, view, slide: sl } = await renderFixture(1000, { callouts });
  try {
    view.setRevealed(0);
    const visible = (node) => { const box = rect(node); return box.width > 0 && box.height > 0 && getComputedStyle(node).visibility !== 'hidden'; };
    const overlaps = (a, b) => a.x < b.right - 1 && a.right > b.x + 1 && a.y < b.bottom - 1 && a.bottom > b.y + 1;
    const state = () => callouts.map((c) => {
      const chip = view.pic.querySelector(`.callout[data-id="${c.id}"]`), item = view.el.querySelector(`.slide-panel [data-id="${c.id}"]`);
      return { id: c.id, chip: rect(chip), chipVisible: visible(chip), evidenceVisible: visible(item) };
    });
    const first = state(), panel = rect(view.el.querySelector('.slide-panel')), heading = rect(view.el.querySelector('.slide-heading'));
    env.geometry.push({ firstPass: first, evidenceStrip: panel, heading, railLayout: evidenceRailDetails(view) });
    assert(panel.width > 0 && panel.height > 0, 'Fallback evidence has no visible parent rail; child boxes alone do not prove visibility');
    assert(first.some((c) => c.chipVisible) && first.some((c) => c.evidenceVisible), 'Crowded fixture did not exercise both overlay and fallback evidence');
    for (const c of first) {
      assert(c.chipVisible !== c.evidenceVisible, 'A supported label is missing or duplicated after fallback');
      if (c.chipVisible) {
        assert(!overlaps(c.chip, heading) && !overlaps(c.chip, panel), 'First layout leaves an overlay over the title or newly visible evidence rail');
        assert(!first.some((other) => other.id !== c.id && other.chipVisible && overlaps(c.chip, other.chip)), 'First layout leaves readable overlay labels on top of each other');

    view.layout(); const second = state();
    assert(JSON.stringify(second) === JSON.stringify(first), 'A second layout changes fallback membership or label positions');
    view.setRevealed(-1); view.setRevealed(0);
    assert(JSON.stringify(state()) === JSON.stringify(first), 'Hiding and revealing the same evidence changes settled placement');

    view.setRevealed(0); const imageBefore = rect(view.img);

test('The walkthrough URL flag preserves playback context and keeps its frames outside the slide stack', async () => {
  const original = location.href;
  const configure = b => { for (const s of b.slides) s.image_url = imageFixture; return b; };
  try {
    const url = new URL(original); url.searchParams.delete('presentation'); history.replaceState(null, '', url);
    await setup({voiceMode:false, configure}); await atProof();
    const baseline = snapshot(player.context()), baselineSpeech = snapshot(env.played);
    assert(!host.querySelector('.slide-cam'), 'Default renderer acquired a camera wrapper');
    url.searchParams.set('presentation', 'walkthrough'); history.replaceState(null, '', url);
    await setup({voiceMode:false, configure}); await atProof();
    assert(host.querySelector('.wt-hall') && host.querySelector('.slide-cam'), 'Flag did not mount the walkthrough');
    assert(!host.querySelector('.slide-stack .wt-frame') && host.querySelectorAll('.slide-stack .slide.on').length === 1, 'Gallery frames replaced or duplicated the active slide');
    assert(JSON.stringify(player.context()) === JSON.stringify(baseline), 'Presentation changed the playback checkpoint or profile');
    assert(JSON.stringify(env.played) === JSON.stringify(baselineSpeech), 'Camera movement delayed or changed narration');
    assert(host.querySelectorAll('.pl-top').length === 1 && host.querySelectorAll('.pl-dock').length === 1, 'Presentation replaced player controls');
  } finally { player?.destroy(); player = null; history.replaceState(null, '', original); }
});
